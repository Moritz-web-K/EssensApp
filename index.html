<style>
/* ===========================================================================
   COLOURS, FONTS, SIZES  —  change anything here and it applies everywhere
   =========================================================================== */
:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: rgba(32,30,29,.16);

  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;

  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;

  --shadow-sm: 0 1px 2px rgba(46,43,37,.14);
  --shadow-md: 0 3px 10px rgba(46,43,37,.16);
  --shadow-lg: 0 12px 32px rgba(46,43,37,.22);
}

/* ===========================================================================
   BASE
   =========================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
::selection { background: var(--color-accent-200); }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }

/* ===========================================================================
   SHARED BITS
   =========================================================================== */
.kicker {
  font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--color-accent-700);
}
.h1 { font-family: var(--font-heading); font-size: 44px; line-height: 1.04; margin-top: 6px; }
.h2 { font-family: var(--font-heading); font-size: 30px; line-height: 1.1; }
.h3 { font-family: var(--font-heading); font-size: 21px; }
.lead { font-size: 14.5px; color: var(--color-neutral-700); margin-top: 8px; max-width: 620px; }
.muted { font-size: 12px; color: var(--color-neutral-600); }

.btn {
  border: 0; border-radius: 999px; padding: 11px 22px;
  font-size: 14.5px; font-weight: 600; cursor: pointer;
  transition: background .12s ease;
}
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: #b2622d; }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { background: var(--color-surface); color: var(--color-text); }
.btn-secondary:hover { background: var(--color-neutral-300); }
.btn-block { display: block; width: 100%; }

.linkbtn {
  border: 0; background: transparent; padding: 0; cursor: pointer;
  color: var(--color-accent-700);
  text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn:hover { color: var(--color-accent-800); }

.input {
  width: 100%; min-height: 46px;
  border: 1.5px solid var(--color-neutral-400); border-radius: 999px;
  background: var(--color-neutral-100); color: var(--color-text);
  padding: 10px 18px; font: inherit; font-size: 15px;
}
.input:focus { border-color: var(--color-accent); outline: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--color-neutral-700); padding-left: 4px; }

.banner {
  font-size: 13.5px; color: var(--color-accent-800);
  background: var(--color-accent-100); border-radius: 20px;
  padding: 12px 18px; display: flex; gap: 12px; align-items: center;
}
.banner button { border: 0; background: transparent; cursor: pointer; color: inherit; }

.avatar {
  flex: none; display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
}

/* ===========================================================================
   FULL-SCREEN ENTRY SCREENS  (login, pick your name)
   =========================================================================== */
.centre {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; animation: fadeIn .3s ease both;
}
.logo {
  width: 44px; height: 44px; border-radius: 999px;
  background: var(--color-accent); display: grid; place-items: center;
}

/* ===========================================================================
   APP FRAME  —  header + main column
   =========================================================================== */
.shell { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  background: var(--color-surface); padding: 13px 40px;
  position: sticky; top: 0; z-index: 30;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; row-gap: 8px;
  max-width: 1180px; margin: 0 auto;
}
.main { flex: 1; min-width: 0; overflow: auto; padding: 34px 40px 44px; }
.main-inner { max-width: 1180px; margin: 0 auto; }

.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-family: var(--font-heading); font-size: 19px; }

.toplinks { display: flex; gap: 4px; flex: 1; }
.toplinks .navbtn { width: auto; }

.navbtn {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 10px 15px; border: 0; border-radius: 999px; cursor: pointer;
  font-size: 14px; background: transparent; color: var(--color-neutral-800); white-space: nowrap;
}
.navbtn:hover { background: var(--color-accent-200); }
.navbtn.on { background: var(--color-accent); color: var(--color-bg); }
.navbtn.on:hover { background: var(--color-accent); }
.navbtn span:first-of-type { flex: 1; }

.topright { display: flex; align-items: center; gap: 16px; flex: none; }
.livedot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
.livewrap { display: flex; align-items: center; gap: 7px; }

.awaybtn-compact {
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  background: transparent; border: 1px dashed var(--color-neutral-400);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--color-text);
}
.awaybtn-compact:hover { background: var(--color-accent-100); border-color: var(--color-accent); }

.whoami-compact { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

.awaybtn {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  background: transparent; border: 1px dashed var(--color-neutral-400);
  border-radius: 22px; padding: 12px 14px; cursor: pointer;
}
.awaybtn:hover { background: var(--color-accent-100); border-color: var(--color-accent); }

.whoami { display: flex; align-items: center; gap: 10px; }

.iconbtn {
  width: 30px; height: 30px; flex: none; border: 0; border-radius: 999px;
  background: var(--color-bg); cursor: pointer; font-size: 12px;
  color: var(--color-neutral-700);
}
.iconbtn:hover { background: var(--color-accent-100); }

.hamburger {
  display: none; width: 38px; height: 38px; flex: none; align-items: center; justify-content: center;
  border: 0; border-radius: 999px; background: transparent; font-size: 19px; cursor: pointer;
  color: var(--color-neutral-800);
}
.hamburger:hover { background: var(--color-accent-200); }

.mobilemenu {
  display: none; background: var(--color-surface); padding: 6px 22px 22px;
  flex-direction: column; gap: 16px; animation: riseIn .18s ease both;
}
.mobilemenu-divider { height: 1px; background: var(--color-divider); }

/* ===========================================================================
   TODAY
   =========================================================================== */
.cols { display: flex; gap: 32px; align-items: flex-start; justify-content: center; }
/* Always its own row below the title — col-main is narrower than the
   Week/Month tabs' full-width header, so reusing .monthhead's side-by-side
   flex-wrap here made the nav's position shift depending on title length. */
.daynav { margin-top: 14px; }
.col-main { flex: 1; min-width: 0; }
.col-side { width: 340px; flex: none; }

.dishcard {
  margin-top: 22px; background: var(--color-surface); border-radius: 34px;
  padding: 24px 26px; box-shadow: var(--shadow-sm);
}
.dishcard .label {
  font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--color-accent);
}

.answer-pair { display: flex; gap: 14px; margin-top: 18px; }
.bigbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 20px 0; border-radius: 30px; cursor: pointer;
  border: 1.5px solid var(--color-neutral-400);
  background: var(--color-surface); color: var(--color-text);
}
.bigbtn strong { font-family: var(--font-heading); font-size: 24px; font-weight: 400; }
.bigbtn small { font-size: 12.5px; opacity: .8; }
.bigbtn.on-yes {
  background: var(--color-accent); color: var(--color-bg);
  border-color: var(--color-accent); box-shadow: var(--shadow-md);
}
.bigbtn.on-no {
  background: var(--color-neutral-800); color: var(--color-neutral-100);
  border-color: var(--color-neutral-800); box-shadow: var(--shadow-md);
}

.cutoff {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
  padding-left: 4px; font-size: 13px; color: var(--color-neutral-700);
}

.headcount {
  margin-top: 30px; background: var(--color-accent-100);
  border-radius: 30px; padding: 20px 22px;
}
.headcount .big { font-family: var(--font-heading); font-size: 34px; line-height: 1; }
.bar {
  margin-top: 14px; height: 10px; border-radius: 999px;
  background: var(--color-neutral-300); overflow: hidden; display: flex;
}
.bar span { display: block; height: 100%; }

.rostercard {
  margin-top: 22px; background: var(--color-surface); border-radius: 34px;
  padding: 22px 24px; box-shadow: var(--shadow-sm);
}
.rosterhead { display: flex; align-items: baseline; justify-content: space-between; }
.rostergroup + .rostergroup { margin-top: 20px; }
.group-label { display: flex; align-items: baseline; gap: 8px; font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; }
.group-count { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--color-neutral-600); }

.avatarstack { display: flex; margin-top: 10px; }
.avatarstack .avatar { margin-left: -9px; border: 2px solid var(--color-surface); }
.avatarstack .avatar:first-child { margin-left: 0; }
.avatarstack .avatar.more { background: var(--color-neutral-300); color: var(--color-neutral-800); font-size: 10px; }

.dishvotecard {
  margin-top: 22px; background: var(--color-surface); border-radius: 34px;
  padding: 22px 24px; box-shadow: var(--shadow-sm);
}
.gerichtrow {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--color-bg); border-radius: 18px; padding: 10px 14px;
}
.gerichtrow .name { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 110px; }
.gerichtrow .count { font-size: 12px; color: var(--color-neutral-600); white-space: nowrap; }
.gerichtrow .sub { display: block; font-weight: 400; font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
.logchip { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.logchip.create { color: var(--color-accent-2-800); background: var(--color-accent-2-100); }
.logchip.update { color: var(--color-accent-700); background: var(--color-accent-100); }
.logchip.delete { color: var(--color-neutral-800); background: var(--color-neutral-300); }

/* Wünsche + suggestions in free day cards */
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.wishlist { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.wishrow {
  display: flex; align-items: center; gap: 14px;
  background: var(--color-bg); border-radius: 18px; padding: 10px 12px 10px 18px;
}
.wishrow .name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
.wishrow .sub { display: block; font-weight: 400; font-size: 12px; color: var(--color-neutral-600); margin-top: 1px; }
.wishrow .votes { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--color-neutral-700); white-space: nowrap; }
.wishbtn {
  flex: none; min-width: 122px; border-radius: 999px; padding: 8px 15px; font-size: 13px; cursor: pointer; white-space: nowrap;
  border: 1.5px solid var(--color-neutral-400); background: transparent; color: var(--color-neutral-700);
}
.wishbtn.on { background: var(--color-accent-200); border-color: var(--color-accent); color: var(--color-accent-800); font-weight: 700; }
.planchip {
  flex: none; min-width: 122px; text-align: center; font-size: 12px; font-weight: 700; white-space: nowrap;
  color: var(--color-accent-2-800); background: var(--color-accent-2-100); border-radius: 999px; padding: 8px 14px;
}
.suggchip {
  font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--color-accent-700);
  background: var(--color-accent-100); border-radius: 999px; padding: 4px 10px;
}
.allbtn {
  margin-top: 14px; width: 100%; border: 1.5px solid var(--color-neutral-400); background: transparent;
  border-radius: 999px; padding: 11px; font-size: 13.5px; font-weight: 600; color: var(--color-neutral-800); cursor: pointer;
}
.miniavatars { display: flex; }
.miniavatars .avatar { width: 20px; height: 20px; font-size: 7.5px; margin-left: -5px; border: 1.5px solid var(--color-bg); }
.miniavatars .avatar:first-child { margin-left: 0; }
.daycard .dish.open { font-family: var(--font-body); color: var(--color-neutral-600); font-size: 13.5px; flex: none; }
.suggest {
  margin-top: 10px; flex: 1; display: flex; flex-direction: column; gap: 3px;
  background: var(--color-bg); border: 1.5px dashed var(--color-accent-300); border-radius: 20px; padding: 12px;
}
.suggest .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 700; }
.suggest .nm { font-family: var(--font-heading); font-size: 16px; line-height: 1.15; margin-top: 2px; }
.suggest .meta { font-size: 11.5px; color: var(--color-neutral-700); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.suggest .take {
  margin-top: 8px; border: 0; border-radius: 999px; background: var(--color-accent); color: var(--color-bg);
  padding: 8px 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.ac { margin-top: 8px; background: var(--color-neutral-100); border: 1.5px solid var(--color-neutral-300); border-radius: 20px; overflow: hidden; }
.ac-item {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%;
  padding: 11px 16px; border: 0; border-bottom: 1px solid var(--color-divider); background: transparent;
  font-size: 14px; text-align: left; cursor: pointer;
}
.ac-item:last-child { border-bottom: 0; }
.ac-item:hover { background: var(--color-accent-100); }
.ac-item .m { font-size: 12px; color: var(--color-neutral-600); white-space: nowrap; }
mark { background: none; color: var(--color-accent-700); font-weight: 700; }

.balance-amount { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.balance-amount.owes { color: var(--color-accent-700); }
.balance-amount.even { color: var(--color-neutral-600); font-weight: 400; }
.balance-amount.credit { color: var(--color-accent-2-700); }

.pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--color-bg); border-radius: 999px; padding: 5px 14px 5px 5px;
}
.pill .name { flex: 1; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===========================================================================
   WEEK
   =========================================================================== */
.weekgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 24px; }
.daycard {
  border-radius: 30px; padding: 18px; background: var(--color-surface);
  border: 1px solid transparent; display: flex; flex-direction: column; min-height: 280px;
}
.daycard.today { background: var(--color-accent-100); border-color: var(--color-accent-300); }
.daycard .dow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600); }
.daycard .dom { font-family: var(--font-heading); font-size: 28px; line-height: 1.05; margin-top: 2px; }
.daycard .dish { font-family: var(--font-heading); font-size: 17px; line-height: 1.2; margin-top: 14px; flex: 1; }
.thinbar { margin-top: 8px; height: 7px; border-radius: 999px; background: var(--color-neutral-300); overflow: hidden; }
.thinbar span { display: block; height: 100%; }
.smallpair { display: flex; gap: 7px; margin-top: 14px; }
.smallbtn {
  flex: 1; padding: 8px 0; border-radius: 999px;
  border: 1px solid var(--color-neutral-400); cursor: pointer; font-size: 13px;
  background: transparent; color: var(--color-neutral-700);
}
.smallbtn.on-yes { background: var(--color-accent); color: var(--color-bg); border-color: transparent; }
.smallbtn.on-no { background: var(--color-neutral-800); color: var(--color-neutral-100); border-color: transparent; }

.stats { display: flex; gap: 14px; margin-top: 22px; }
.stat { flex: 1; border-radius: 28px; padding: 18px 22px; background: var(--color-surface); }
.stat.accent { background: var(--color-accent-100); }
.stat.sage { background: var(--color-accent-2-100); }
.stat .num { font-family: var(--font-heading); font-size: 34px; line-height: 1; }
.stat .cap { font-size: 12.5px; margin-top: 3px; color: var(--color-neutral-700); }
.stat.accent .cap { color: var(--color-accent-800); }
.stat.sage .cap { color: var(--color-accent-2-800); }

/* ===========================================================================
   MONTH
   =========================================================================== */
.monthhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.monthnav { display: flex; gap: 8px; align-items: center; }
.monthnav .label, .monthnav .linkbtn {
  font-family: var(--font-heading); font-size: 15px; min-width: 160px;
  text-align: center; white-space: nowrap;
}

.tablewrap { margin-top: 30px; background: var(--color-surface); border-radius: 30px; padding: 8px 22px 14px; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--color-neutral-700); font-weight: 700;
  padding: 14px 8px; border-bottom: 1px solid var(--color-divider);
}
td { padding: 12px 8px; font-size: 14px; border-bottom: 1px solid rgba(32,30,29,.07); }
tr:last-child td { border-bottom: 0; }

/* ===========================================================================
   DIALOG + TOAST
   =========================================================================== */
.dialog-backdrop {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: rgba(32,30,29,.42); padding: 20px; animation: fadeIn .18s ease both;
}
.dialog {
  width: min(440px, 100%); min-width: 0; background: var(--color-bg);
  border-radius: 30px; padding: 24px 26px; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: 16px; animation: pop .22s ease both;
}
.dialog-title { font-family: var(--font-heading); font-size: 24px; line-height: 1.1; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 90;
  background: var(--color-neutral-900); color: var(--color-neutral-100);
  border-radius: 999px; padding: 12px 22px; font-size: 13.5px;
  box-shadow: var(--shadow-lg); animation: pop .3s ease both;
}

/* ===========================================================================
   COMPACT  —  tablets and phones; the header collapses to a hamburger menu
   and the Today tab's two side-by-side columns stop fitting comfortably
   =========================================================================== */
@media (max-width: 1150px) {
  .topbar { padding: 12px 18px; }
  .topbar-inner { gap: 14px; }
  .toplinks, .topright { display: none; }
  .hamburger { display: flex; }
  .mobilemenu { display: flex; }
  .main { padding: 22px 18px 40px; }
  .main-inner { max-width: none; }
  .cols { flex-direction: column; }
  .col-main, .col-side { width: auto; max-width: none; }
  .weekgrid { grid-template-columns: 1fr; }
  .daycard { min-height: 0; }
  .stats { flex-direction: column; }
  .h1 { font-size: 34px; }
}

/* ===========================================================================
   PHONES  —  the desktop-scale cards (dish, Yes/No, headcount) are too
   heavy stacked one after another on a narrow screen, so scale them down
   a notch here. Tablets (600–1150px) keep the roomier sizing above.
   =========================================================================== */
@media (max-width: 600px) {
  .h1 { font-size: 27px; }
  .lead { font-size: 13px; }

  .dishcard { margin-top: 16px; padding: 16px 18px; border-radius: 22px; }
  .dishcard .h2 { font-size: 21px; }

  .answer-pair { gap: 10px; margin-top: 14px; }
  .bigbtn { padding: 13px 0; border-radius: 20px; }
  .bigbtn strong { font-size: 18px; }
  .bigbtn small { font-size: 11px; }

  .cutoff { margin-top: 10px; font-size: 12px; }

  .headcount { margin-top: 18px; padding: 15px 18px; border-radius: 22px; }
  .headcount .big { font-size: 24px; }
  .bar { margin-top: 10px; height: 8px; }

  /* Name on its own line, chips/avatars/button wrap underneath it */

<script>

   in with the office password.

const SUPABASE_URL = "https://wmysyplhcbnnunuiskum.supabase.co";
const SUPABASE_KEY = "sb_publishable_pnJAsLuKUcXFgSmHLvDeDA_7Xt4w93H";

// The accounts the different teams share. Not real mailboxes — auth just

const DOW = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];

/* ===========================================================================
   STATE  —  everything the screen is drawn from

const state = {
  phase: "boot",          // boot | login | pick | app
  tab: "today",           // today | week | month
  menuOpen: false,        // mobile hamburger menu
  me: null,               // set from meKey() in afterLogin(), once we know the team

  answers: {},            // { "2026-09-05": { personId: true } }
  costs: {},               // { "2026-09-05": 32.5 } — what that day's meal cost
  balances: [],            // [{ id, name, balance }] — running Kasse total per person
  generalCosts: [],        // recent general_costs entries, for editing/deleting in Übersicht
  payments: [],            // recent payments entries, for editing/deleting in Übersicht
  moneyLog: [],            // recent changes to costs/payments (who, when, what), newest first
  absences: [],
  settings: { cutoff: "09:00", tz: "" },
  weekOffset: 0,
  dayOffset: 0,
  manageDay: null,        // Verwalten tab: which day Doro/Isabella are editing; null = today
  totalCookDays: 0,       // Übersicht: how many days ever had a dish set
  totalDishCostAll: 0,    // Übersicht: sum of every meal_costs.amount ever entered
  last30Count: 0,         // Übersicht: your own Ja-answers in the last 30 days
  allDishes: [],           // every distinct dish name ever cooked (most recent 500 days)
  dishLastServed: {},      // { "Lasagne": "2026-09-05" } — last day on or before today it was cooked
  dishVotes: {},           // { "Lasagne": ["personId1", "personId2"] } — who wished for which dish
  dishOverrides: {},       // { "Lasagne": { displayName, hidden } } — list-only edits, history untouched
  dishListOpen: false,     // Diese Woche: "Alle Gerichte" expanded
  dishSearch: "",          // Diese Woche: search text in "Alle Gerichte"
  dishEdit: false,         // Diese Woche: managers' rename/remove mode
  dishQuery: "",           // "dish" dialog: what's been typed, for name suggestions
  dialog: null,           // null | "dish" | "away" | "cost" | "payment" | "generalcost" | "renamedish" | "confirm"
  dialogDay: null,
  dialogId: null,          // "payment"/"generalcost" dialogs: id of the entry being edited, null = creating new
  dialogError: null,       // message shown inside the open dialog (e.g. wrong PIN)
  confirmMessage: "",      // "confirm" dialog: what's about to be removed
  confirmAct: null,        // "confirm" dialog: which action to run if confirmed
  confirmArg: null,        // "confirm" dialog: argument to pass that action
};

let client = null;
let channel = null;
let toastTimer = null;
let lastRefreshAt = 0;
let liveRefreshTimer = null;


/* ===========================================================================
   SMALL HELPERS
   =========================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const iso = d => d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");

function mondayOf(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  d.setHours(12, 0, 0, 0);
  return d;
}

function weekDays(offset = 0) {
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + offset * 7);
  return [0, 1, 2, 3, 4].map(i => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return iso(d);
  });
}

// The single day the "Heute" tab is currently browsing — offset 0 is the
// real actual today, negative is into the past, positive into the future.
function dayKey(offset = 0) {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + offset);
  return iso(d);
}

// Shifts an arbitrary ISO day (not necessarily today) by `delta` days —
// used by Verwalten's day arrows, which browse from wherever they're at
// rather than from today.
function addDays(dayIso, delta) {
  const d = new Date(dayIso + "T12:00:00");
  d.setDate(d.getDate() + delta);
  return iso(d);
}

function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/);
  const a = parts[0][0] || "?";
  const b = parts[1] ? parts[1][0] : (parts[0][1] || "");
  return (a + b).toUpperCase();
}

function tintFor(id) {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 997;
  return TINTS[h % 3];
}

function isAnswerManager(personId) {
  const p = state.people.find(x => x.id === personId);
  return !!p && !!p.is_manager;
}

function flash(msg) {
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
}

function fail(e) {
  state.error = (e && e.message) || String(e);
  render();
}

const icon = {
  bowl: (size, stroke) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="${stroke}" stroke-width="2.75" stroke-linecap="round">
    <path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M12 4v3"></path></svg>`,
  calendar: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"></rect>
    <path d="M8 3v4M16 3v4M3 11h18"></path></svg>`,
  chart: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"></path></svg>`,
  clock: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle>
    <path d="M12 8v4l2.5 2"></path></svg>`,
  palm: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-700)"
    stroke-width="2.75" stroke-linecap="round" style="flex:none;margin-top:2px">
    <path d="M4 20h16"></path><path d="M12 20V9"></path><path d="M12 9c4-3 8-2 8-2s-1 5-8 2z"></path></svg>`,
  sliders: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M21 18h0"></path>
    <circle cx="16" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>`,
};


/* ===========================================================================
   TALKING TO THE DATABASE
   =========================================================================== */
async function start() {
  if (!window.supabase) {
    state.error = "Datenbank-Bibliothek konnte nicht geladen werden — bitte Verbindung prüfen.";
    state.phase = "login";
    render();
    return;
  }
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await client.auth.getSession();
  if (data && data.session) await afterLogin();
  else { state.phase = "login"; render(); }
}

async function login(teamCode, password) {
  const code = (teamCode || "").trim().toLowerCase();
  const email = TEAMS[code];
  if (!email) { state.error = "Unbekannter Team-Code."; render(); return; }
  state.busy = true;
  state.error = null;
  render();
  const { error } = await client.auth.signInWithPassword({ email, password });
  state.busy = false;
  if (error) { state.error = "Team-Code oder Passwort war falsch."; render(); return; }
  localStorage.setItem(TEAM_KEY, code);
  await afterLogin();
}

// Every table is team-scoped, so the app needs to know its own team_id
// before it can write anything — current_team_id() resolves that from
// whichever team's shared login this session authenticated as.
async function afterLogin() {
  const { data: teamId, error } = await client.rpc("current_team_id");
  if (error || !teamId) {
    state.error = "Team konnte nicht ermittelt werden.";
    state.phase = "login";
    render();
    return;
  }
  state.teamId = teamId;
  state.me = localStorage.getItem(meKey()) || null;
  state.phase = state.me ? "app" : "pick";
  state.error = null;
  render();
  await refresh();
  subscribe();
}

// Live updates: when anyone answers, changes a dish, or edits the roster,
// every open browser reloads its data within about a second. Actions we
// trigger ourselves (like clicking Ja/Nein) already call refresh() directly
// for instant feedback — this same change then echoes back through the
// subscription a moment later. Debouncing here, and skipping when a refresh
// just ran, avoids re-rendering (and re-flashing the fade-in animation)
// twice for one click, while still picking up changes from other people.
function liveRefresh() {
  clearTimeout(liveRefreshTimer);
  liveRefreshTimer = setTimeout(() => {
    if (Date.now() - lastRefreshAt < 2000) return;
    refresh();
  }, 250);
}

function subscribe() {
  if (channel) return;
  channel = client.channel("cantina")
    .on("postgres_changes", { event: "*", schema: "public", table: "answers" }, liveRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "meals" }, liveRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "people" }, liveRefresh)
    .subscribe(status => { state.live = status === "SUBSCRIBED"; render(); });
}

async function refresh() {
  if (!client) return;
  // Always include the real current week (the sidebar badge needs it) plus
  // whichever week "Diese Woche" is browsing, whichever single day "Heute"
  // is browsing, and whichever day "Verwalten" (Doro/Isabella) has open —
  // all if different from the current week.
  const currentDays = weekDays(0);
  const extraDays = [];
  if (state.weekOffset !== 0) extraDays.push(...weekDays(state.weekOffset));
  if (state.dayOffset !== 0) extraDays.push(dayKey(state.dayOffset));
  if (state.manageDay) extraDays.push(state.manageDay);
  const days = extraDays.length ? Array.from(new Set([...currentDays, ...extraDays])) : currentDays;
  const thirtyAgo = iso(new Date(Date.now() - 30 * 86400000));
  const last30Query = state.me
    ? client.from("answers").select("day", { count: "exact", head: true })
        .eq("person_id", state.me).eq("eating", true).gte("day", thirtyAgo)
    : Promise.resolve({ count: 0, error: null });
  try {
    const [people, meals, answers, absences, settings, dishHistory, costs, balances, allDishCosts, last30, dishVotes, dishOverrides, generalCosts, payments, moneyLog] = await Promise.all([
      client.from("people").select("id,name,active,is_chef,is_manager").eq("active", true).order("name"),
      client.from("meals").select("day,dish").in("day", days),
      client.from("answers").select("day,person_id,eating").in("day", days),
      client.from("absences").select("id,person_id,from_day,to_day"),
      client.from("settings").select("cutoff,tz").maybeSingle(),
      client.from("meals").select("day,dish").not("dish", "is", null).order("day", { ascending: false }).limit(500),
      client.from("meal_costs").select("day,amount").in("day", days),
      client.from("person_balances").select("person_id,name,balance,meals_eaten,dish_owed"),
      client.from("meal_costs").select("amount"),
      last30Query,
      client.from("dish_votes").select("dish,person_id"),
      client.from("dish_overrides").select("dish,display_name,hidden"),
      client.from("general_costs").select("id,amount,note,created_at").order("created_at", { ascending: false }).limit(20),
      client.from("payments").select("id,person_id,amount,note,paid_on,created_at").order("created_at", { ascending: false }).limit(20),
      client.from("money_log").select("created_at,actor_id,kind,action,ref_day,ref_person,old_ref_person,old_amount,new_amount,note")
        .order("created_at", { ascending: false }).limit(30),
    ]);

    const broke = [people, meals, answers, absences, dishHistory, costs, balances, allDishCosts, last30, dishVotes, dishOverrides, generalCosts, payments].find(r => r.error);
    if (broke) throw broke.error;

    state.people = people.data || [];
    state.absences = absences.data || [];
    if (settings && settings.data) state.settings = settings.data;

    state.meals = {};
    (meals.data || []).forEach(m => { state.meals[m.day] = m.dish; });

    state.answers = {};
    (answers.data || []).forEach(a => {
      if (!state.answers[a.day]) state.answers[a.day] = {};
      state.answers[a.day][a.person_id] = a.eating;
    });

    state.totalCookDays = (dishHistory.data || []).length;
    state.totalDishCostAll = (allDishCosts.data || []).reduce((t, c) => t + Number(c.amount), 0);
    state.last30Count = last30.count || 0;

    state.dishVotes = {};
    (dishVotes.data || []).forEach(v => {
      if (!state.dishVotes[v.dish]) state.dishVotes[v.dish] = [];
      state.dishVotes[v.dish].push(v.person_id);
    });

    state.dishOverrides = {};
    (dishOverrides.data || []).forEach(o => {
      state.dishOverrides[o.dish] = { displayName: o.display_name, hidden: !!o.hidden };
    });

    // "day" comes back newest first, so the first past row for each dish name
    // is the last time it was actually cooked. Future days are planned, not
    // cooked, so they count for the list but not for "zuletzt vor …".
    const todayIso = iso(new Date());
    const seen = new Set();
    state.dishLastServed = {};
    (dishHistory.data || []).forEach(m => {
      if (!m.dish) return;
      seen.add(m.dish);
      if (m.day <= todayIso && !state.dishLastServed[m.dish]) state.dishLastServed[m.dish] = m.day;
    });
    state.allDishes = Array.from(seen);

    state.costs = {};
    (costs.data || []).forEach(c => { state.costs[c.day] = Number(c.amount); });

    state.balances = (balances.data || []).map(b =>
      ({ id: b.person_id, name: b.name, balance: Number(b.balance), mealsEaten: b.meals_eaten || 0,
        dishOwed: Number(b.dish_owed) || 0 }));

    state.generalCosts = (generalCosts.data || []).map(g =>
      ({ id: g.id, amount: Number(g.amount), note: g.note, createdAt: g.created_at }));
    // Not part of the "broke" check above: a missing log (e.g. before its SQL
    // has been run) just shows an empty list instead of breaking the app.
    state.moneyLog = moneyLog.error ? [] : (moneyLog.data || []);
    state.payments = (payments.data || []).map(p =>
      ({ id: p.id, personId: p.person_id, amount: Number(p.amount), note: p.note,
        paidOn: p.paid_on, createdAt: p.created_at }));

    lastRefreshAt = Date.now();
    render();
  } catch (e) { fail(e); }
}

// Shared by answer() (always state.me) and manageAnswer() (Doro/Isabella
// setting anyone's answer). Tapping the value already set clears it back
// to "no answer yet" — same toggle behavior either way.
async function writeAnswer(day, personId, eating) {
  const current = (state.answers[day] || {})[personId];
  const next = current === eating ? null : eating;
  if (next === null) {
    const { error } = await client.from("answers")
      .delete().eq("day", day).eq("person_id", personId);
    if (error) throw error;
  } else {
    const { error } = await client.from("answers")
      .upsert({ day, person_id: personId, eating: next, team_id: state.teamId }, { onConflict: "day,person_id" });
    if (error) throw error;
  }
  return next;
}

async function answer(day, eating) {
  if (!state.me) return;
  try {
    const next = await writeAnswer(day, state.me, eating);
    await refresh();
    if (next !== null) flash(next ? "Du bist dabei" : "Als nicht essend markiert");
  } catch (e) { fail(e); }
}

// Doro/Isabella only: set or clear anyone's answer, on any day, no cutoff.
// Goes through the manage_set_answer() database function instead of a
// direct table write — that function briefly tells the cutoff trigger to
// stand down for this one write, rather than removing that protection for
// everyone else.
async function manageAnswer(day, personId, eating) {
  try {
    const current = (state.answers[day] || {})[personId];
    const next = current === eating ? null : eating;
    const { error } = await client.rpc("manage_set_answer", { p_day: day, p_person_id: personId, p_eating: next });
    if (error) throw error;
    await refresh();
    const person = state.people.find(p => p.id === personId);
    const name = person ? person.name : "Person";
    flash(next === null ? name + ": Eintrag entfernt" : name + (next ? ": auf Ja gesetzt" : ": auf Nein gesetzt"));
  } catch (e) { fail(e); }
}

// Dish names are typed freely, so one dish can exist under several
// spellings. The list groups them by their shown name (after any rename,
// ignoring case) — which is also how two dishes get merged on purpose:
// rename one to exactly the other's name.
function dishKey(name) {
  const o = state.dishOverrides[name] || {};
  return (o.displayName || name || "").trim().toLowerCase();
}

function dishGroups() {
  const groups = new Map();
  for (const raw of state.allDishes) {
    const o = state.dishOverrides[raw] || {};
    if (o.hidden) continue;
    const key = dishKey(raw);
    if (!groups.has(key)) groups.set(key, { key, name: (o.displayName || raw).trim(), raws: [], voters: [], last: null });
    const g = groups.get(key);
    g.raws.push(raw);  // allDishes is newest first, so raws[0] is the most recent spelling
    for (const pid of state.dishVotes[raw] || []) {
      if (!g.voters.includes(pid) && state.people.some(p => p.id === pid)) g.voters.push(pid);
    }
    const d = state.dishLastServed[raw];
    if (d && (!g.last || d > g.last)) g.last = d;
  }
  return Array.from(groups.values());
}

function findDishGroup(name) {
  const key = dishKey(name);
  return dishGroups().find(g => g.key === key) || null;
}

async function saveDish(day, dish) {
  state.dialog = null;
  if (!dish) { render(); return; }
  try {
    const { error } = await client.from("meals")
      .upsert({ day, dish, team_id: state.teamId }, { onConflict: "team_id,day" });
    if (error) throw error;
    // Planning a dish "spends" its wishes — it drops off the Wünsche list
    // until people wish for it again, under every spelling merged into it.
    const group = findDishGroup(dish);
    const keys = group ? group.raws.slice() : [];
    if (!keys.includes(dish)) keys.push(dish);
    const { error: e2 } = await client.from("dish_votes").delete().in("dish", keys);
    if (e2) throw e2;
    await refresh();
    flash("Gericht für alle aktualisiert");
  } catch (e) { fail(e); }
}

// Everyone can wish for a dish — an open vote for "cook this again soon".
// A new wish is stored under the group's most recent spelling.
async function toggleWish(key) {
  if (!state.me) return;
  const group = dishGroups().find(g => g.key === key);
  if (!group) return;
  try {
    if (group.voters.includes(state.me)) {
      const { error } = await client.from("dish_votes").delete().eq("person_id", state.me).in("dish", group.raws);
      if (error) throw error;
    } else {
      const { error } = await client.from("dish_votes").insert({ dish: group.raws[0], person_id: state.me, team_id: state.teamId });
      if (error) throw error;
    }
    await refresh();
  } catch (e) { fail(e); }
}

// Opens the app's own styled confirm dialog instead of the browser's native
// confirm() — same look as every other dialog. `act`/`arg` say what to run
// if the person confirms (see runConfirmedDelete).
function openConfirm(message, act, arg) {
  state.dialog = "confirm";
  state.confirmMessage = message;
  state.confirmAct = act;
  state.confirmArg = arg;
  render();
}

// Hides a dish (every spelling of it) from the list from now on. Doesn't
// touch past days that had it — those keep showing it wherever history is.
async function hideDish(key) {
  const group = dishGroups().find(g => g.key === key);
  if (!group) return;
  try {
    const rows = group.raws.map(dish => ({ dish, hidden: true, team_id: state.teamId }));
    const { error } = await client.from("dish_overrides").upsert(rows, { onConflict: "team_id,dish" });
    if (error) throw error;
    await refresh();
    flash("Aus der Liste entfernt");
  } catch (e) { fail(e); }
}

// Changes only how a dish is labeled in the list — past days keep their
// original name. Renaming to another dish's exact name merges the two.
async function saveRenameDish(key, newName) {
  state.dialog = null;
  const group = dishGroups().find(g => g.key === key);
  if (!group || !newName) { render(); return; }
  const target = findDishGroup(newName);
  const merging = target && target.key !== key;
  try {
    const name = merging ? target.name : newName;
    const rows = group.raws.map(dish => ({ dish, display_name: name, team_id: state.teamId }));
    const { error } = await client.from("dish_overrides").upsert(rows, { onConflict: "team_id,dish" });
    if (error) throw error;
    await refresh();
    flash(merging ? `Mit „${name}“ zusammengeführt` : "Umbenannt");
  } catch (e) { fail(e); }
}

// Doro/Isabella only (UI-gated, see manageAnswer's comment above for why the
// database itself can't tell them apart from anyone else). An empty amount
// removes the day's cost entirely instead of saving "0 €".
// Money changes go through database functions that check the manager's
// personal PIN first — the shared team login on its own can only read
// costs and payments, so picking a manager's name isn't enough.
async function moneyRpc(fn, args) {
  const input = document.getElementById("managerPin");
  const pin = input ? input.value.trim() : "";
  const { data, error } = await client.rpc(fn, { p_person_id: state.me, p_pin: pin, ...args });
  if (error) throw error;
  return data;
}

// Shows the problem inside the open dialog (wrong PIN, bad amount) instead
// of closing it, so nothing typed is lost — only the PIN fields are cleared.
function dialogFail(e) {
  state.dialogError = (e && e.message) || String(e);
  render();
  document.querySelectorAll(".dialog input[type=password]").forEach(i => { i.value = ""; });
  const first = document.querySelector(".dialog input[type=password]");
  if (first) first.focus();
}

async function saveCost(day, amountStr) {
  const trimmed = (amountStr || "").trim().replace(",", ".");
  const amount = trimmed ? Number(trimmed) : null;
  if (amount !== null && (!Number.isFinite(amount) || amount < 0)) {
    dialogFail({ message: "Bitte einen gültigen Betrag eingeben." });
    return;
  }
  try {
    await moneyRpc("money_set_meal_cost", { p_day: day, p_amount: amount });
    state.dialog = null;
    await refresh();
    flash(amount === null ? "Kosten entfernt" : "Kosten gespeichert");
  } catch (e) { dialogFail(e); }
}

// Doro/Isabella only: records a payment that lowers one person's running
// balance. Balances themselves are computed entirely in the database (the
// person_balances view) rather than in JS, so the split math lives in one
// place.
async function savePayment(personId, amountStr, note) {
  const editId = state.dialogId;
  const amount = Number((amountStr || "").trim().replace(",", "."));
  if (!personId || !Number.isFinite(amount) || amount <= 0) {
    dialogFail({ message: "Bitte einen gültigen Betrag eingeben." });
    return;
  }
  try {
    await moneyRpc("money_save_payment", { p_id: editId || null, p_payer: personId, p_amount: amount, p_note: note || null });
    state.dialog = null;
    state.dialogId = null;
    await refresh();
    const person = state.people.find(p => p.id === personId);
    flash(editId ? "Einzahlung aktualisiert"
      : (person ? person.name : "Person") + ": Einzahlung von " + amount.toFixed(2).replace(".", ",") + " € gespeichert");
  } catch (e) { dialogFail(e); }
}

// Doro/Isabella only: removes a payment entirely, raising the person's
// balance back up by that amount.
async function deletePayment(id) {
  try {
    await moneyRpc("money_delete_payment", { p_id: id });
    state.dialog = null;
    await refresh();
    flash("Einzahlung gelöscht");
  } catch (e) { dialogFail(e); }
}

// Doro/Isabella only: costs that aren't tied to one day's dish (cleaning
// supplies, spices, that kind of thing) and get split evenly across
// everyone instead of just the people who answered Ja that day. Who it's
// split among is snapshotted into general_cost_shares right now, at the
// currently-active person list — so if someone joins or leaves later, this
// entry's split stays exactly as it was when it was entered.
async function saveGeneralCost(amountStr, note) {
  const editId = state.dialogId;
  const amount = Number((amountStr || "").trim().replace(",", "."));
  if (!Number.isFinite(amount) || amount <= 0) {
    dialogFail({ message: "Bitte einen gültigen Betrag eingeben." });
    return;
  }
  try {
    // Editing only changes amount/note — the database keeps the split among
    // exactly the people it was first divided between (see comment above).
    await moneyRpc("money_save_general_cost", { p_id: editId || null, p_amount: amount, p_note: note || null });
    state.dialog = null;
    state.dialogId = null;
    await refresh();
    flash(editId ? "Allgemeinkosten aktualisiert" : "Allgemeinkosten auf " + state.people.length + " Personen aufgeteilt");
  } catch (e) { dialogFail(e); }
}

// Doro/Isabella only: removes a general-cost entry and the per-person shares
// it was split into. Shares are deleted first since they reference the cost
// row by id and there's no guarantee the DB cascades that automatically.
async function deleteGeneralCost(id) {
  try {
    await moneyRpc("money_delete_general_cost", { p_id: id });
    state.dialog = null;
    await refresh();
    flash("Allgemeinkosten-Eintrag gelöscht");
  } catch (e) { dialogFail(e); }
}

async function changePin(oldPin, newPin, newPin2) {
  if (!/^[0-9]{4,8}$/.test(newPin)) { dialogFail({ message: "Die neue PIN muss aus 4 bis 8 Ziffern bestehen." }); return; }
  if (newPin !== newPin2) { dialogFail({ message: "Die beiden neuen PINs stimmen nicht überein." }); return; }
  try {
    const { error } = await client.rpc("change_manager_pin", { p_person_id: state.me, p_old_pin: oldPin, p_new_pin: newPin });
    if (error) throw error;
    state.dialog = null;
    render();
    flash("PIN geändert");
  } catch (e) { dialogFail(e); }
}

const shortDay = day => new Date(day + "T12:00:00")
  .toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" });

// Same rule the database's cutoff trigger enforces: today's answer is
// locked once the team's cutoff time has passed. Checking it here lets the
// app skip today instead of sending a write the database would reject.
function todayLocked() {
  const cutoff = ((state.settings.cutoff || "09:00") + ":00").slice(0, 8);
  const opts = { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" };
  if (state.settings.tz) opts.timeZone = state.settings.tz;
  return new Date().toLocaleTimeString("en-GB", opts) > cutoff;
}

// Marks every weekday in the range as "not eating". Past days stay locked,
// and so does today once the cutoff has passed — it's skipped rather than
// failing the whole save. The answers go in first, so a failed save never
// leaves an "Abwesend bis …" label behind with no answers to match.
async function saveAway(from, to) {
  state.dialog = null;
  if (!from || !to || !state.me) { render(); return; }
  if (to < from) [from, to] = [to, from];
  const today = iso(new Date());
  const locked = todayLocked();
  let skippedToday = false;
  const rows = [];
  const d = new Date(from + "T12:00:00");
  const end = new Date(to + "T12:00:00");
  while (d <= end) {
    const day = iso(d);
    if (d.getDay() >= 1 && d.getDay() <= 5) {
      if (day > today || (day === today && !locked)) {
        rows.push({ day, person_id: state.me, eating: false, team_id: state.teamId });
      } else if (day === today) {
        skippedToday = true;
      }
    }
    d.setDate(d.getDate() + 1);
  }
  if (!rows.length) {
    flash(skippedToday
      ? "Nichts eingetragen — heute ist seit " + (state.settings.cutoff || "09:00").slice(0, 5) + " Uhr gesperrt"
      : "Nichts eingetragen — im Zeitraum liegt kein Werktag ab heute");
    return;
  }
  try {
    const { error: e1 } = await client.from("answers").upsert(rows, { onConflict: "day,person_id" });
    if (e1) throw e1;
    const { error: e2 } = await client.from("absences")
      .insert({ person_id: state.me, from_day: from, to_day: to, team_id: state.teamId });
    if (e2) throw e2;
    await refresh();
    flash("Abwesend — für " + rows.length + (rows.length === 1 ? " Tag" : " Tage") + " mit Nein beantwortet"
      + (skippedToday ? " (heute war schon gesperrt)" : ""));
  } catch (e) { fail(e); }
}

// Removes an absence and the "Nein" answers on its days that can still be
// changed. Past days (and today after the cutoff) keep their answer.
async function deleteAbsence(id) {
  const a = state.absences.find(x => String(x.id) === String(id));
  if (!a) return;
  const today = iso(new Date());
  const locked = todayLocked();
  const days = [];
  const d = new Date(a.from_day + "T12:00:00");
  const end = new Date(a.to_day + "T12:00:00");
  while (d <= end) {
    const day = iso(d);
    if (day > today || (day === today && !locked)) days.push(day);
    d.setDate(d.getDate() + 1);
  }
  try {
    if (days.length) {
      const { error: e1 } = await client.from("answers").delete()
        .eq("person_id", a.person_id).eq("eating", false).in("day", days);
      if (e1) throw e1;
    }
    const { error: e2 } = await client.from("absences").delete().eq("id", a.id);
    if (e2) throw e2;
    await refresh();
    flash("Abwesenheit gelöscht");
  } catch (e) { fail(e); }
}

async function addPerson(name) {
  if (!name) return;
  const { error } = await client.from("people").insert({ name, team_id: state.teamId });
  if (error) { fail(error); return; }
  await refresh();
}

// People are never deleted — just marked inactive, so old months keep their numbers.
async function removePerson(id) {
  const { error } = await client.from("people").update({ active: false }).eq("id", id);
  if (error) { fail(error); return; }
  await refresh();
}

/* ===========================================================================
   DRAWING THE SCREEN
   ---------------------------------------------------------------------------
   render() rebuilds the whole page from `state`. Anything typed into a text
   box is carried across, so live updates never eat what you're writing.
   =========================================================================== */
let lastDialogKey = "";

function render() {
  const app = document.getElementById("app");

  // Which dialog (and which day) was on screen last time. If that changed we
  // must NOT carry text across — otherwise Thursday's half-typed dish would
  // reappear when you open Monday.
  const dialogKey = String(state.dialog) + "|" + String(state.dialogDay);
  const sameDialog = dialogKey === lastDialogKey;
  lastDialogKey = dialogKey;
  if (!sameDialog) state.dialogError = null;

  const typed = {};
  app.querySelectorAll("input[id]").forEach(i => { typed[i.id] = i.value; });
  const focused = document.activeElement ? document.activeElement.id : null;

  app.innerHTML = screen();

  if (sameDialog) {
    app.querySelectorAll("input[id]").forEach(i => {
      if (typed[i.id] !== undefined) i.value = typed[i.id];
    });
  }
  if (focused) {
    const again = document.getElementById(focused);
    if (again) again.focus();
  }
}

function screen() {
  if (state.phase === "boot") return "";
  if (state.phase === "login") return loginScreen();
  if (state.phase === "pick") return pickScreen();
  return appScreen();
}
