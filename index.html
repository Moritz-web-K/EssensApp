neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"876b1f8a-2a4d-40be-b39b-f074cb49fc4a\"><\u002Fscript>\n<script src=\"a48a94bf-8b64-4809-95a0-fce0475115df\"><\u002Fscript>\n<style>\nbody{margin:0;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}\n@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}\n@media (max-width:860px){.cant-shell{flex-direction:column!important}.cant-side{width:auto!important}.cant-main{padding:22px 18px 40px!important}.cant-cols{flex-direction:column!important}.cant-roster{width:auto!important}.cant-week{grid-template-columns:1fr!important}.cant-stats{flex-direction:column!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"cant-shell\" style=\"min-height:100vh;display:flex\">\n\n  <!-- ── SETUP ── -->\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px;animation:fadeIn .3s ease both\">\n      <div style=\"width:560px;max-width:100%\">\n        <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-accent-700)\">One-time setup<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:40px;line-height:1.05;margin-top:8px\">Connect your kitchen<\u002Fdiv>\n        <p style=\"font-size:14.5px;color:var(--color-neutral-700);margin-top:8px\">This device doesn't know which database to use yet. Paste the two values from Supabase → Settings → API to try it out here.<\u002Fp>\n        <p style=\"font-size:13px;color:var(--color-accent-800);background:var(--color-accent-100);border-radius:20px;padding:12px 16px;margin-top:14px\">Before you share the link with your coworkers, put the same two values in the top of this file (<code>SUPABASE_URL<\u002Fcode> and <code>SUPABASE_KEY<\u002Fcode>) — then this screen never appears for anyone and they only see the password. See SETUP.md step 4.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:20px\">\n          <div class=\"field\"><label>Project URL<\u002Flabel><input class=\"input\" value=\"{{ cfgUrl }}\" sc-camel-on-change=\"{{ onCfgUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"min-height:46px\"><\u002Fdiv>\n          <div class=\"field\"><label>Anon public key<\u002Flabel><input class=\"input\" value=\"{{ cfgKey }}\" sc-camel-on-change=\"{{ onCfgKey }}\" placeholder=\"eyJhbGciOi…\" style=\"min-height:46px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ saveCfg }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:16px;padding:13px;font-size:15px\">Save and continue<\u002Fbutton>\n        <sc-if value=\"{{ error }}\"><p style=\"margin-top:12px;font-size:13px;color:var(--color-accent-800);background:var(--color-accent-100);border-radius:18px;padding:11px 15px\">{{ error }}<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ── LOGIN ── -->\n  <sc-if value=\"{{ isLogin }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px;animation:fadeIn .3s ease both\">\n      <div style=\"width:420px;max-width:100%\">\n        <span style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent);display:grid;place-items:center\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-bg)\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M3 11h18a9 9 0 0 1-18 0z\"><\u002Fpath><path d=\"M12 4v3\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <div style=\"font-family:var(--font-heading);font-size:36px;line-height:1.05;margin-top:16px\">Cantina<\u002Fdiv>\n        <p style=\"font-size:14.5px;color:var(--color-neutral-700);margin-top:6px\">Enter the office password.<\u002Fp>\n        <form sc-camel-on-submit=\"{{ onLoginSubmit }}\" style=\"margin-top:16px\">\n          <input class=\"input\" type=\"password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ onPw }}\" placeholder=\"Office password\" style=\"min-height:46px;font-size:15px\">\n          <button type=\"submit\" class=\"btn btn-primary btn-block\" style=\"margin-top:12px;padding:13px;font-size:15px\">{{ loginLabel }}<\u002Fbutton>\n        <\u002Fform>\n        <sc-if value=\"{{ error }}\"><p style=\"margin-top:12px;font-size:13px;color:var(--color-accent-800);background:var(--color-accent-100);border-radius:18px;padding:11px 15px\">{{ error }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ notBaked }}\">\n          <button sc-camel-on-click=\"{{ clearCfg }}\" style=\"margin-top:14px;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;font-size:12.5px;color:var(--color-neutral-600);text-decoration:underline;text-underline-offset:3px\">Change project settings<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ── PICK NAME ── -->\n  <sc-if value=\"{{ isPick }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px;animation:fadeIn .3s ease both\">\n      <div style=\"width:660px;max-width:100%\">\n        <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-accent-700)\">First time on this device<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:42px;line-height:1.05;margin-top:8px\">Who are you?<\u002Fdiv>\n        <p style=\"font-size:14.5px;color:var(--color-neutral-700);margin-top:8px\">Pick your name once — this browser remembers you.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:22px\">\n          <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div style=\"display:flex;align-items:center;gap:4px;background:var(--color-surface);border-radius:999px;padding:5px 6px 5px 5px\">\n              <button sc-camel-on-click=\"{{ p.pick }}\" style=\"flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;cursor:pointer;font:inherit;font-size:13.5px;color:var(--color-text)\">\n                <span style=\"width:32px;height:32px;flex:none;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;background:{{ p.tint }};color:{{ p.ink }}\">{{ p.initials }}<\u002Fspan>\n                <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ p.remove }}\" title=\"Remove colleague\" style=\"width:28px;height:28px;flex:none;border:0;border-radius:999px;background:transparent;cursor:pointer;font:inherit;font-size:12px;color:var(--color-neutral-600)\" style-hover=\"background:var(--color-accent-200);color:var(--color-accent-800)\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:16px;max-width:430px\">\n          <input class=\"input\" value=\"{{ newName }}\" sc-camel-on-change=\"{{ onNewName }}\" placeholder=\"New colleague's name\" style=\"min-height:44px;font-size:14px\">\n          <button sc-camel-on-click=\"{{ addPerson }}\" class=\"btn btn-primary\" style=\"padding:10px 20px;white-space:nowrap\">Add colleague<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--color-neutral-600);margin-top:10px\">{{ rosterCountLine }}<\u002Fp>\n        <sc-if value=\"{{ error }}\"><p style=\"margin-top:10px;font-size:13px;color:var(--color-accent-800);background:var(--color-accent-100);border-radius:18px;padding:11px 15px\">{{ error }}<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ── APP ── -->\n  <sc-if value=\"{{ isApp }}\">\n    <div class=\"cant-side\" style=\"width:250px;flex:none;background:var(--color-surface);display:flex;flex-direction:column;padding:26px 18px 18px\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:0 8px\">\n        <span style=\"width:34px;height:34px;border-radius:999px;background:var(--color-accent);display:grid;place-items:center\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-bg)\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M3 11h18a9 9 0 0 1-18 0z\"><\u002Fpath><path d=\"M12 4v3\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-size:20px\">Cantina<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;margin-top:26px\">\n        <button sc-camel-on-click=\"{{ goToday }}\" style=\"{{ navTodayStyle }}\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M3 11h18a9 9 0 0 1-18 0z\"><\u002Fpath><path d=\"M12 4v3\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1\">Today<\u002Fspan><span style=\"font-size:12px;opacity:.8\">{{ headcountBadge }}<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goWeek }}\" style=\"{{ navWeekStyle }}\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"4\"><\u002Frect><path d=\"M8 3v4M16 3v4M3 11h18\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1\">This week<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goMonth }}\" style=\"{{ navMonthStyle }}\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M5 20V12M12 20V5M19 20v-6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1\">Monthly overview<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openAway }}\" style=\"display:flex;gap:10px;align-items:flex-start;text-align:left;background:transparent;border:1px dashed var(--color-neutral-400);border-radius:22px;padding:12px 14px;cursor:pointer;font:inherit\" style-hover=\"background:var(--color-accent-100);border-color:var(--color-accent)\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M4 20h16\"><\u002Fpath><path d=\"M12 20V9\"><\u002Fpath><path d=\"M12 9c4-3 8-2 8-2s-1 5-8 2z\"><\u002Fpath><\u002Fsvg>\n        <span><span style=\"display:block;font-size:12.5px;font-weight:700\">{{ awayTitle }}<\u002Fspan><span style=\"display:block;font-size:11.5px;color:var(--color-neutral-700)\">{{ awaySub }}<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--color-divider)\">\n        <span style=\"width:34px;height:34px;flex:none;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center;font-size:12px;font-weight:700\">{{ myInitials }}<\u002Fspan>\n        <span style=\"flex:1;min-width:0\">\n          <span style=\"display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ myName }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ forgetName }}\" style=\"border:0;background:transparent;padding:0;cursor:pointer;font:inherit;font-size:11.5px;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:2px\">Not you?<\u002Fbutton>\n        <\u002Fspan>\n        <button sc-camel-on-click=\"{{ signOut }}\" title=\"Sign out\" style=\"width:30px;height:30px;flex:none;border:0;border-radius:999px;background:var(--color-bg);cursor:pointer;font:inherit;font-size:12px;color:var(--color-neutral-700)\" style-hover=\"background:var(--color-accent-100)\">⏻<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px;margin-top:12px;padding:0 8px;font-size:11px;color:var(--color-neutral-600)\">\n        <span style=\"width:7px;height:7px;border-radius:999px;background:{{ liveColor }}\"><\u002Fspan><span>{{ liveLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cant-main\" style=\"flex:1;min-width:0;overflow:auto;padding:34px 40px 44px\">\n      <sc-if value=\"{{ error }}\">\n        <div style=\"margin-bottom:18px;font-size:13.5px;color:var(--color-accent-800);background:var(--color-accent-100);border-radius:20px;padding:12px 18px;display:flex;gap:12px;align-items:center\">\n          <span style=\"flex:1\">{{ error }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ dismissError }}\" style=\"border:0;background:transparent;cursor:pointer;font:inherit;font-size:13px;color:var(--color-accent-800)\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- TODAY -->\n      <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"cant-cols\" style=\"animation:riseIn .3s ease both;display:flex;gap:32px;align-items:flex-start\">\n        <div style=\"flex:1;min-width:0;max-width:620px\">\n          <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-accent-700)\">{{ todayKicker }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1.04;margin-top:6px\">Eating today?<\u002Fdiv>\n\n          <div style=\"margin-top:22px;background:var(--color-surface);border-radius:34px;padding:24px 26px;box-shadow:var(--shadow-sm)\">\n            <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent)\">Today's dish<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:30px;line-height:1.1;margin-top:6px\">{{ todayDish }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ openEdit }}\" style=\"margin-top:8px;padding:0;border:0;background:transparent;cursor:pointer;font:inherit;font-family:var(--font-heading);font-size:13px;text-align:left;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px\">Change today's dish<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:14px;margin-top:18px\">\n            <button sc-camel-on-click=\"{{ sayIn }}\" style=\"{{ inBtnStyle }}\">\n              <span style=\"font-family:var(--font-heading);font-size:24px\">Yes<\u002Fspan>\n              <span style=\"font-size:12.5px;opacity:.8\">count me in<\u002Fspan>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ sayOut }}\" style=\"{{ outBtnStyle }}\">\n              <span style=\"font-family:var(--font-heading);font-size:24px\">No<\u002Fspan>\n              <span style=\"font-size:12.5px;opacity:.8\">not today<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:12px;padding-left:4px;font-size:13px;color:var(--color-neutral-700)\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4l2.5 2\"><\u002Fpath><\u002Fsvg>\n            <span>{{ cutoffLine }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:30px;background:var(--color-accent-100);border-radius:30px;padding:20px 22px\">\n            <div style=\"display:flex;align-items:baseline;gap:12px\">\n              <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1\">{{ headcountBadge }}<\u002Fspan>\n              <span style=\"font-size:14px;color:var(--color-accent-800)\">confirmed for the kitchen<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;height:10px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden;display:flex\">\n              <span style=\"width:{{ pctIn }}%;background:var(--color-accent)\"><\u002Fspan>\n              <span style=\"width:{{ pctUnknown }}%;background:var(--color-accent-300)\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:12.5px;color:var(--color-accent-800)\">{{ splitLine }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"cant-roster\" style=\"width:340px;flex:none\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n            <div style=\"font-family:var(--font-heading);font-size:21px\">At the table<\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--color-neutral-600)\">live<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:18px\">\n            <sc-for list=\"{{ whoGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;gap:8px\">\n                  <span style=\"font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:{{ g.color }}\">{{ g.label }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:var(--color-neutral-600)\">{{ g.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n                  <sc-for list=\"{{ g.people }}\" as=\"p\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;gap:10px;background:var(--color-surface);border-radius:999px;padding:5px 14px 5px 5px\">\n                      <span style=\"width:30px;height:30px;flex:none;border-radius:999px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:{{ p.tint }};color:{{ p.ink }}\">{{ p.initials }}<\u002Fspan>\n                      <span style=\"flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n                      <span style=\"font-size:11px;color:var(--color-neutral-600);flex:none\">{{ p.note }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- WEEK -->\n      <sc-if value=\"{{ isWeek }}\">\n      <div style=\"animation:riseIn .3s ease both\">\n        <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-accent-700)\">{{ weekRange }}<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1.04;margin-top:6px\">This week<\u002Fdiv>\n        <p style=\"font-size:14.5px;color:var(--color-neutral-700);margin-top:8px;max-width:620px\">{{ weekSummary }}<\u002Fp>\n\n        <div class=\"cant-week\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:24px\">\n          <sc-for list=\"{{ week }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"border-radius:30px;padding:18px;background:{{ d.bg }};border:1px solid {{ d.border }};display:flex;flex-direction:column;min-height:280px\">\n              <div style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)\">{{ d.dow }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:28px;line-height:1.05;margin-top:2px\">{{ d.dom }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.2;margin-top:14px;flex:1\">{{ d.dish }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ d.edit }}\" style=\"padding:0;border:0;background:transparent;cursor:pointer;font:inherit;font-size:11.5px;text-align:left;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:2px\">Set dish<\u002Fbutton>\n              <div style=\"font-size:11.5px;color:var(--color-neutral-600);margin-top:10px\">{{ d.countLine }}<\u002Fdiv>\n              <div style=\"margin-top:8px;height:7px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden\">\n                <span style=\"display:block;height:100%;width:{{ d.pct }}%;background:{{ d.barColor }}\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:7px;margin-top:14px\">\n                <button sc-camel-on-click=\"{{ d.sayIn }}\" style=\"{{ d.inStyle }}\">Yes<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ d.sayOut }}\" style=\"{{ d.outStyle }}\">No<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"cant-stats\" style=\"display:flex;gap:14px;margin-top:22px;max-width:760px\">\n          <div style=\"flex:1;background:var(--color-accent-2-100);border-radius:26px;padding:16px 20px\">\n            <div style=\"font-family:var(--font-heading);font-size:26px;line-height:1\">{{ weekMeals }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-accent-2-800);margin-top:3px\">meals to cook this week<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:var(--color-surface);border-radius:26px;padding:16px 20px\">\n            <div style=\"font-family:var(--font-heading);font-size:26px;line-height:1\">{{ weekBusiest }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:3px\">busiest day<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- MONTH -->\n      <sc-if value=\"{{ isMonth }}\">\n      <div style=\"animation:riseIn .3s ease both\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n          <div>\n            <div style=\"font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-accent-700)\">Kitchen records<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1.04;margin-top:6px\">Monthly overview<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center\">\n            <button sc-camel-on-click=\"{{ prevMonth }}\" class=\"btn btn-secondary\" style=\"padding:9px 16px\">‹<\u002Fbutton>\n            <span style=\"font-family:var(--font-heading);font-size:17px;min-width:130px;text-align:center\">{{ monthLabel }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ nextMonth }}\" class=\"btn btn-secondary\" style=\"padding:9px 16px\">›<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"cant-stats\" style=\"display:flex;gap:14px;margin-top:24px\">\n          <div style=\"flex:1;background:var(--color-accent-100);border-radius:28px;padding:18px 22px\">\n            <div style=\"font-family:var(--font-heading);font-size:36px;line-height:1\">{{ monthTotal }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-accent-800);margin-top:3px\">meals eaten in {{ monthShort }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:var(--color-accent-2-100);border-radius:28px;padding:18px 22px\">\n            <div style=\"font-family:var(--font-heading);font-size:36px;line-height:1\">{{ monthDays }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-accent-2-800);margin-top:3px\">days the chef cooked<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:var(--color-surface);border-radius:28px;padding:18px 22px\">\n            <div style=\"font-family:var(--font-heading);font-size:36px;line-height:1\">{{ myTotal }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:3px\">your meals<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:30px;background:var(--color-surface);border-radius:30px;padding:8px 22px 14px\">\n          <sc-raw-table class=\"table\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Person<\u002Fsc-raw-th><sc-raw-th>Meals<\u002Fsc-raw-th><sc-raw-th style=\"width:46%\">Share of cooking days<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ monthRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n                <sc-raw-tr>\n                  <sc-raw-td>{{ r.name }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-weight:700\">{{ r.count }}<\u002Fsc-raw-td>\n                  <sc-raw-td><span style=\"display:block;height:8px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden\"><span style=\"display:block;height:100%;width:{{ r.pct }}%;background:{{ r.color }}\"><\u002Fspan><\u002Fspan><\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--color-neutral-600);margin-top:10px\">Counted from confirmed yeses. Past days are locked, so these numbers can't be edited after the fact.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- DIALOGS -->\n    <sc-if value=\"{{ dialogOpen }}\">\n      <div class=\"dialog-backdrop\" style=\"animation:fadeIn .18s ease both\">\n        <div class=\"dialog\" style=\"animation:pop .22s ease both\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px\">\n            <div>\n              <div class=\"dialog-title\">{{ dialogTitle }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:2px\">{{ dialogSub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ closeDialog }}\" style=\"width:32px;height:32px;flex:none;border:0;border-radius:999px;background:var(--color-bg);cursor:pointer;font:inherit;font-size:14px\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ dialogIsEdit }}\">\n            <div class=\"field\"><label>Dish<\u002Flabel><input class=\"input\" value=\"{{ draftDish }}\" sc-camel-on-change=\"{{ onDraftDish }}\" style=\"font-size:15px;min-height:44px\"><\u002Fdiv>\n            <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0\">Anyone can correct the dish — the latest edit wins and everyone sees it within a second.<\u002Fp>\n            <div class=\"dialog-actions\"><button sc-camel-on-click=\"{{ closeDialog }}\" class=\"btn btn-secondary\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ saveDish }}\" class=\"btn btn-primary\">Save dish<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ dialogIsAway }}\">\n            <div style=\"display:flex;gap:12px\">\n              <div class=\"field\" style=\"flex:1\"><label>From<\u002Flabel><input class=\"input\" type=\"date\" value=\"{{ awayFrom }}\" sc-camel-on-change=\"{{ onAwayFrom }}\" style=\"min-height:44px\"><\u002Fdiv>\n              <div class=\"field\" style=\"flex:1\"><label>Until<\u002Flabel><input class=\"input\" type=\"date\" value=\"{{ awayTo }}\" sc-camel-on-change=\"{{ onAwayTo }}\" style=\"min-height:44px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0\">Every weekday in the range is answered \"no\" for you. Days before today stay locked.<\u002Fp>\n            <div class=\"dialog-actions\"><button sc-camel-on-click=\"{{ closeDialog }}\" class=\"btn btn-secondary\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ saveAway }}\" class=\"btn btn-primary\">Set away<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ toast }}\">\n      <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:999px;padding:12px 22px;font-size:13.5px;box-shadow:var(--shadow-lg);animation:pop .3s ease both\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst TINTS = [[\"var(--color-accent-200)\",\"var(--color-accent-800)\"],[\"var(--color-accent-2-200)\",\"var(--color-accent-2-800)\"],[\"var(--color-neutral-300)\",\"var(--color-neutral-800)\"]];\nconst DOW = [\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\"];\n// ─────────────────────────────────────────────────────────────────────────\n//  FILL THESE TWO IN ONCE, BEFORE YOU DEPLOY  (Supabase → Settings → API)\n//  Once both are filled, nobody ever sees a setup screen — colleagues open\n//  the link and get straight to the password. Safe to publish: this key can\n//  read and write nothing until someone signs in with the office password.\n// ─────────────────────────────────────────────────────────────────────────\nconst SUPABASE_URL = \"https://wmysyplhcbnnunuiskum.supabase.co\";\nconst SUPABASE_KEY = \"sb_publishable_pnJAsLuKUcXFgSmHLvDeDA_7Xt4w93H\";\n\nconst CFG_KEY = \"cantina.cfg\";\n// Auth needs some identifier internally; this fake one is baked in so nobody\n// ever types or owns an email. Only the office password is ever entered.\nconst OFFICE_ID = \"office@cantina.local\";\nconst ME_KEY = \"cantina.me\";\n\nconst iso = d => d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\nfunction mondayOf(d) { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); x.setHours(12, 0, 0, 0); return x; }\nfunction initials(n) { const p = String(n || \"?\").trim().split(/\\s+/); return ((p[0][0] || \"?\") + (p[1] ? p[1][0] : (p[0][1] || \"\"))).toUpperCase(); }\nfunction tint(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 997; return TINTS[h % 3]; }\n\nclass Component extends DCLogic {\n  state = {\n    phase: \"boot\", cfg: null, cfgUrl: \"\", cfgKey: \"\",\n    pw: \"\", busy: false, error: null, toast: null, live: false,\n    me: null, tab: \"today\", newName: \"\",\n    people: [], meals: {}, answers: {}, absences: [], settings: { cutoff: \"09:30\", tz: \"\" },\n    monthOffset: 0, monthRows: [], monthDays: 0,\n    dialog: null, draftDish: \"\", draftDay: null, awayFrom: \"\", awayTo: \"\",\n  };\n\n  componentDidMount() {\n    let cfg = null;\n    if (SUPABASE_URL && SUPABASE_KEY) cfg = { url: SUPABASE_URL, key: SUPABASE_KEY };\n    else { try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || \"null\"); } catch (e) { cfg = null; } }\n    const me = localStorage.getItem(ME_KEY);\n    if (!cfg || !cfg.url || !cfg.key) { this.setState({ phase: \"setup\" }); return; }\n    this.setState({ cfg, cfgUrl: cfg.url, cfgKey: cfg.key, me: me || null });\n    this.boot(cfg, me);\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); if (this.channel) this.channel.unsubscribe(); }\n\n  async waitForLib(ms) {\n    const t0 = Date.now();\n    while (!window.supabase && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 80));\n    return !!window.supabase;\n  }\n\n  async boot(cfg, me) {\n    if (!(await this.waitForLib(8000))) { this.setState({ phase: \"setup\", error: \"Could not load the Supabase library — check your connection.\" }); return; }\n    try {\n      this.client = window.supabase.createClient(cfg.url, cfg.key);\n      const { data } = await this.client.auth.getSession();\n      if (data && data.session) { await this.afterLogin(me); }\n      else this.setState({ phase: \"login\" });\n    } catch (e) { this.setState({ phase: \"setup\", error: \"Could not reach that project: \" + e.message }); }\n  }\n\n  async afterLogin(me) {\n    this.setState({ phase: me ? \"app\" : \"pick\", error: null });\n    await this.refresh();\n    this.subscribe();\n  }\n\n  subscribe() {\n    if (this.channel) return;\n    this.channel = this.client.channel(\"cantina\")\n      .on(\"postgres_changes\", { event: \"*\", schema: \"public\", table: \"answers\" }, () => this.refresh())\n      .on(\"postgres_changes\", { event: \"*\", schema: \"public\", table: \"meals\" }, () => this.refresh())\n      .on(\"postgres_changes\", { event: \"*\", schema: \"public\", table: \"people\" }, () => this.refresh())\n      .subscribe(s => this.setState({ live: s === \"SUBSCRIBED\" }));\n  }\n\n  weekDays() {\n    const mon = mondayOf(new Date());\n    return [0, 1, 2, 3, 4].map(i => { const d = new Date(mon); d.setDate(mon.getDate() + i); return iso(d); });\n  }\n\n  monthRange() {\n    const now = new Date();\n    const first = new Date(now.getFullYear(), now.getMonth() + this.state.monthOffset, 1, 12);\n    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);\n    return { first: iso(first), last: iso(last), label: first.toLocaleDateString(undefined, { month: \"long\", year: \"numeric\" }), short: first.toLocaleDateString(undefined, { month: \"long\" }) };\n  }\n\n  async refresh() {\n    if (!this.client) return;\n    const days = this.weekDays();\n    const mr = this.monthRange();\n    try {\n      const [ppl, mls, ans, abs, set, mAns, mMeals] = await Promise.all([\n        this.client.from(\"people\").select(\"id,name,active\").eq(\"active\", true).order(\"name\"),\n        this.client.from(\"meals\").select(\"day,dish\").in(\"day\", days),\n        this.client.from(\"answers\").select(\"day,person_id,eating\").in(\"day\", days),\n        this.client.from(\"absences\").select(\"id,person_id,from_day,to_day\"),\n        this.client.from(\"settings\").select(\"cutoff,tz\").eq(\"id\", 1).maybeSingle(),\n        this.client.from(\"answers\").select(\"person_id,eating,day\").gte(\"day\", mr.first).lte(\"day\", mr.last).eq(\"eating\", true),\n        this.client.from(\"meals\").select(\"day\").gte(\"day\", mr.first).lte(\"day\", mr.last),\n      ]);\n      const err = [ppl, mls, ans, abs, mAns, mMeals].find(r => r.error);\n      if (err) throw err.error;\n\n      const meals = {}; (mls.data || []).forEach(m => { meals[m.day] = m.dish; });\n      const answers = {}; (ans.data || []).forEach(a => { (answers[a.day] = answers[a.day] || {})[a.person_id] = a.eating; });\n      const counts = {}; (mAns.data || []).forEach(a => { counts[a.person_id] = (counts[a.person_id] || 0) + 1; });\n      const people = ppl.data || [];\n      const monthRows = people.map(p => ({ id: p.id, name: p.name, count: counts[p.id] || 0 })).sort((a, b) => b.count - a.count);\n      this.setState({\n        people, meals, answers, absences: abs.data || [],\n        settings: set && set.data ? set.data : this.state.settings,\n        monthRows, monthDays: (mMeals.data || []).length,\n      });\n    } catch (e) { this.setState({ error: e.message || String(e) }); }\n  }\n\n  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 1800); }\n\n  async login(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const s = this.state;\n    this.setState({ busy: true, error: null });\n    const { error } = await this.client.auth.signInWithPassword({ email: OFFICE_ID, password: s.pw });\n    this.setState({ busy: false, pw: \"\" });\n    if (error) { this.setState({ error: \"That password didn't work.\" }); return; }\n    await this.afterLogin(s.me);\n  }\n\n  async answer(day, eating) {\n    const s = this.state;\n    if (!s.me) return;\n    const cur = (s.answers[day] || {})[s.me];\n    const next = cur === eating ? null : eating;\n    try {\n      if (next === null) {\n        const { error } = await this.client.from(\"answers\").delete().eq(\"day\", day).eq(\"person_id\", s.me);\n        if (error) throw error;\n      } else {\n        const { error } = await this.client.from(\"answers\").upsert({ day, person_id: s.me, eating: next }, { onConflict: \"day,person_id\" });\n        if (error) throw error;\n      }\n      await this.refresh();\n      if (next !== null) this.flash(next ? \"You're in\" : \"Marked not eating\");\n    } catch (e) { this.setState({ error: e.message || String(e) }); }\n  }\n\n  async saveDishNow() {\n    const s = this.state;\n    const day = s.draftDay || this.weekDays()[0];\n    const dish = s.draftDish.trim();\n    if (!dish) { this.setState({ dialog: null }); return; }\n    try {\n      const { error } = await this.client.from(\"meals\").upsert({ day, dish }, { onConflict: \"day\" });\n      if (error) throw error;\n      this.setState({ dialog: null });\n      await this.refresh();\n      this.flash(\"Dish updated for everyone\");\n    } catch (e) { this.setState({ dialog: null, error: e.message || String(e) }); }\n  }\n\n  async saveAwayNow() {\n    const s = this.state;\n    if (!s.awayFrom || !s.awayTo || !s.me) { this.setState({ dialog: null }); return; }\n    const rows = [];\n    const d = new Date(s.awayFrom + \"T12:00:00\"), end = new Date(s.awayTo + \"T12:00:00\");\n    const today = iso(new Date());\n    while (d <= end) {\n      const day = iso(d);\n      if (d.getDay() >= 1 && d.getDay() <= 5 && day >= today) rows.push({ day, person_id: s.me, eating: false });\n      d.setDate(d.getDate() + 1);\n    }\n    try {\n      const { error: e1 } = await this.client.from(\"absences\").insert({ person_id: s.me, from_day: s.awayFrom, to_day: s.awayTo });\n      if (e1) throw e1;\n      if (rows.length) {\n        const { error: e2 } = await this.client.from(\"answers\").upsert(rows, { onConflict: \"day,person_id\" });\n        if (e2) throw e2;\n      }\n      this.setState({ dialog: null });\n      await this.refresh();\n      this.flash(\"Away — answered no for \" + rows.length + \" days\");\n    } catch (e) { this.setState({ dialog: null, error: e.message || String(e) }); }\n  }\n\n  async addPersonNow() {\n    const n = this.state.newName.trim();\n    if (!n) return;\n    const { error } = await this.client.from(\"people\").insert({ name: n });\n    this.setState({ newName: \"\", error: error ? error.message : null });\n    await this.refresh();\n  }\n\n  async removePerson(id) {\n    const { error } = await this.client.from(\"people\").update({ active: false }).eq(\"id\", id);\n    if (error) this.setState({ error: error.message });\n    await this.refresh();\n  }\n\n  bigBtn(active, tone) {\n    const on = tone === \"in\"\n      ? \"background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent)\"\n      : \"background:var(--color-neutral-800);color:var(--color-neutral-100);border-color:var(--color-neutral-800)\";\n    return \"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:20px 0;border-radius:30px;cursor:pointer;font:inherit;border:1.5px solid var(--color-neutral-400);\"\n      + (active ? on + \";box-shadow:var(--shadow-md)\" : \"background:var(--color-surface);color:var(--color-text)\");\n  }\n  smallBtn(active, tone) {\n    const on = tone === \"in\" ? \"background:var(--color-accent);color:var(--color-bg)\" : \"background:var(--color-neutral-800);color:var(--color-neutral-100)\";\n    return \"flex:1;padding:8px 0;border-radius:999px;border:1px solid var(--color-neutral-400);cursor:pointer;font:inherit;font-size:13px;\"\n      + (active ? on + \";border-color:transparent\" : \"background:transparent;color:var(--color-neutral-700)\");\n  }\n  nav(name) {\n    const on = this.state.tab === name;\n    return \"display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;border:0;border-radius:999px;cursor:pointer;font:inherit;font-size:14.5px;background:\"\n      + (on ? \"var(--color-accent)\" : \"transparent\") + \";color:\" + (on ? \"var(--color-bg)\" : \"var(--color-neutral-800)\");\n  }\n\n  renderVals() {\n    const s = this.state;\n    const days = this.weekDays();\n    const today = days.find(d => d === iso(new Date())) || days[0];\n    const total = s.people.length || 1;\n    const todayAns = s.answers[today] || {};\n    const ins = s.people.filter(p => todayAns[p.id] === true);\n    const outs = s.people.filter(p => todayAns[p.id] === false);\n    const unknown = s.people.filter(p => todayAns[p.id] === undefined);\n    const decorate = p => { const t = tint(p.id); return { name: p.name, initials: initials(p.name), tint: t[0], ink: t[1] }; };\n    const myAns = s.me ? todayAns[s.me] : undefined;\n    const cutoff = (s.settings.cutoff || \"09:30\").slice(0, 5);\n    const mr = this.monthRange();\n    const myAbsence = s.absences.find(a => a.person_id === s.me && a.to_day >= iso(new Date()));\n\n    const week = days.map((day, i) => {\n      const a = (s.answers[day] || {});\n      const count = s.people.filter(p => a[p.id] === true).length;\n      const isToday = day === today;\n      const mine = s.me ? a[s.me] : undefined;\n      return {\n        dow: DOW[i], dom: String(Number(day.slice(8))), dish: s.meals[day] || \"No dish set yet\",\n        count, countLine: count + \" of \" + total + (isToday ? \" · today\" : \"\"),\n        pct: Math.round((count / total) * 100),\n        barColor: isToday ? \"var(--color-accent)\" : \"var(--color-accent-2-400)\",\n        bg: isToday ? \"var(--color-accent-100)\" : \"var(--color-surface)\",\n        border: isToday ? \"var(--color-accent-300)\" : \"transparent\",\n        inStyle: this.smallBtn(mine === true, \"in\"),\n        outStyle: this.smallBtn(mine === false, \"out\"),\n        sayIn: () => this.answer(day, true),\n        sayOut: () => this.answer(day, false),\n        edit: () => this.setState({ dialog: \"edit\", draftDay: day, draftDish: s.meals[day] || \"\" }),\n      };\n    });\n    const busiest = week.reduce((b, d) => (d.count > b.count ? d : b), week[0]);\n    const meName = s.me ? (s.people.find(p => p.id === s.me) || {}).name : null;\n    const maxCount = Math.max(1, s.monthDays || 1);\n\n    const group = (label, list, color, note) => ({ label, color, count: list.length + (list.length === 1 ? \" person\" : \" people\"), people: list.map(p => Object.assign(decorate(p), { note: note(p) })) });\n\n    return {\n      isSetup: s.phase === \"setup\", isLogin: s.phase === \"login\", isPick: s.phase === \"pick\", isApp: s.phase === \"app\",\n      cfgUrl: s.cfgUrl, cfgKey: s.cfgKey,\n      onCfgUrl: e => this.setState({ cfgUrl: e.target.value.trim() }),\n      onCfgKey: e => this.setState({ cfgKey: e.target.value.trim() }),\n      saveCfg: () => {\n        const cfg = { url: s.cfgUrl, key: s.cfgKey };\n        if (!cfg.url || !cfg.key) { this.setState({ error: \"Both fields are needed.\" }); return; }\n        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));\n        this.setState({ cfg, error: null, phase: \"boot\" });\n        this.boot(cfg, s.me);\n      },\n      notBaked: !(SUPABASE_URL && SUPABASE_KEY),\n      clearCfg: () => { localStorage.removeItem(CFG_KEY); this.setState({ phase: \"setup\", error: null }); },\n      pw: s.pw, onPw: e => this.setState({ pw: e.target.value }),\n      onLoginSubmit: e => this.login(e),\n      loginLabel: s.busy ? \"Checking…\" : \"Enter\",\n      error: s.error, dismissError: () => this.setState({ error: null }), toast: s.toast,\n      liveColor: s.live ? \"var(--color-accent-2-500)\" : \"var(--color-neutral-400)\",\n      liveLabel: s.live ? \"Live — updates instantly\" : \"Connecting…\",\n\n      people: s.people.map(p => Object.assign(decorate(p), {\n        pick: () => { localStorage.setItem(ME_KEY, p.id); this.setState({ me: p.id, phase: \"app\" }); },\n        remove: () => this.removePerson(p.id),\n      })),\n      newName: s.newName,\n      onNewName: e => this.setState({ newName: e.target.value }),\n      addPerson: () => this.addPersonNow(),\n      rosterCountLine: s.people.length + \" people on the list — remove anyone who left, add new starters.\",\n      myName: meName, myInitials: meName ? initials(meName) : \"\",\n      forgetName: () => { localStorage.removeItem(ME_KEY); this.setState({ me: null, phase: \"pick\" }); },\n      signOut: async () => { await this.client.auth.signOut(); this.setState({ phase: \"login\" }); },\n\n      isToday: s.tab === \"today\", isWeek: s.tab === \"week\", isMonth: s.tab === \"month\",\n      goToday: () => this.setState({ tab: \"today\" }),\n      goWeek: () => this.setState({ tab: \"week\" }),\n      goMonth: () => this.setState({ tab: \"month\" }),\n      navTodayStyle: this.nav(\"today\"), navWeekStyle: this.nav(\"week\"), navMonthStyle: this.nav(\"month\"),\n\n      todayKicker: new Date().toLocaleDateString(undefined, { weekday: \"long\", day: \"numeric\", month: \"long\" }),\n      todayDish: s.meals[today] || \"No dish set yet\",\n      openEdit: () => this.setState({ dialog: \"edit\", draftDay: today, draftDish: s.meals[today] || \"\" }),\n      inBtnStyle: this.bigBtn(myAns === true, \"in\"),\n      outBtnStyle: this.bigBtn(myAns === false, \"out\"),\n      sayIn: () => this.answer(today, true),\n      sayOut: () => this.answer(today, false),\n      cutoffLine: myAns === undefined ? \"Answer before \" + cutoff + \" — after that the kitchen is locked\" : \"Changeable until \" + cutoff,\n      headcountBadge: ins.length + \" / \" + total,\n      pctIn: Math.round((ins.length / total) * 100),\n      pctUnknown: Math.round((unknown.length / total) * 100),\n      splitLine: ins.length + \" yes · \" + outs.length + \" no · \" + unknown.length + \" unanswered, counted as no at \" + cutoff,\n      whoGroups: [\n        group(\"Eating\", ins, \"var(--color-accent-800)\", () => \"\"),\n        group(\"Not eating\", outs, \"var(--color-neutral-700)\", () => \"\"),\n        group(\"No answer yet\", unknown, \"var(--color-accent-700)\", () => \"counts as no\"),\n      ],\n\n      week, weekRange: days[0].split(\"-\").reverse().join(\".\") + \" – \" + days[4].split(\"-\").reverse().join(\".\"),\n      weekSummary: \"You're in for \" + days.filter(d => (s.answers[d] || {})[s.me] === true).length + \" of 5 days. Answer ahead and the chef stops guessing.\",\n      weekMeals: week.reduce((t, d) => t + d.count, 0),\n      weekBusiest: busiest ? busiest.dow : \"—\",\n\n      monthLabel: mr.label, monthShort: mr.short,\n      prevMonth: () => this.setState(p => ({ monthOffset: p.monthOffset - 1 }), () => this.refresh()),\n      nextMonth: () => this.setState(p => ({ monthOffset: Math.min(0, p.monthOffset + 1) }), () => this.refresh()),\n      monthRows: s.monthRows.map(r => ({\n        name: r.id === s.me ? r.name + \" (you)\" : r.name,\n        count: r.count, pct: Math.round((r.count / maxCount) * 100),\n        color: r.id === s.me ? \"var(--color-accent)\" : \"var(--color-accent-2-500)\",\n      })),\n      monthTotal: s.monthRows.reduce((t, r) => t + r.count, 0),\n      monthDays: s.monthDays,\n      myTotal: (s.monthRows.find(r => r.id === s.me) || { count: 0 }).count,\n\n      dialogOpen: !!s.dialog, dialogIsEdit: s.dialog === \"edit\", dialogIsAway: s.dialog === \"away\",\n      dialogTitle: s.dialog === \"away\" ? \"Away or on holiday\" : \"Set the dish\",\n      dialogSub: s.dialog === \"away\" ? \"Answers no for every weekday in the range\" : \"Anyone can edit — latest wins\",\n      closeDialog: () => this.setState({ dialog: null }),\n      draftDish: s.draftDish, onDraftDish: e => this.setState({ draftDish: e.target.value }),\n      saveDish: () => this.saveDishNow(),\n      openAway: () => this.setState({ dialog: \"away\" }),\n      awayTitle: myAbsence ? \"Away until \" + myAbsence.to_day : \"Away or on holiday?\",\n      awaySub: myAbsence ? \"Answered no automatically\" : \"Set a date range\",\n      awayFrom: s.awayFrom, awayTo: s.awayTo,\n      onAwayFrom: e => this.setState({ awayFrom: e.target.value }),\n      onAwayTo: e => this.setState({ awayTo: e.target.value }),\n      saveAway: () => this.saveAwayNow(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
