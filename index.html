        <span style="display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(myName)}</span>
        <button class="linkbtn" data-act="forgetMe" style="font-size:11.5px;text-underline-offset:2px">Nicht du?</button>
      </span>
      <button class="iconbtn" data-act="signOut" title="Abmelden">&#9096;</button>
    </div>`;

  const liveColor = state.live ? "var(--color-accent-2-500)" : "var(--color-neutral-400)";
  const liveText = state.live ? "Live &mdash; sofortige Updates" : "Verbindung wird hergestellt&hellip;";
  const liveDot = `<span class="livedot" style="background:${liveColor}" title="${esc(state.live ? "Live — sofortige Updates" : "Verbindung wird hergestellt…")}"></span>`;
  const liveFull = `<div class="livewrap muted">${liveDot}<span>${liveText}</span></div>`;

  const body = state.tab === "week" ? weekTab()
    : state.tab === "month" ? monthTab()
    : state.tab === "manage" && isManager ? manageTab()
    : todayTab();

  return `<div class="shell">
    <header class="topbar"><div class="topbar-inner">
      <div class="brand">
        <span class="logo" style="width:34px;height:34px">${icon.bowl(19, "var(--color-bg)")}</span>
        <span class="brand-name">Cantina</span>
      </div>

      <nav class="toplinks">${navLinks}</nav>

      <div class="topright">
        ${liveDot}
        ${awayCompact}
        ${whoamiCompact}
      </div>

      <button class="hamburger" data-act="toggleMenu" aria-label="${state.menuOpen ? "Menü schließen" : "Menü öffnen"}">
        ${state.menuOpen ? "&#10005;" : "&#9776;"}
      </button>
    </div></header>

    ${state.menuOpen ? `<div class="mobilemenu">
      <div style="display:flex;flex-direction:column;gap:4px">${navLinks}</div>
      <div class="mobilemenu-divider"></div>
      ${awayFull}
      ${whoamiFull}
      ${liveFull}
    </div>` : ""}

    <div class="main"><div class="main-inner">${errorBanner()}${body}</div></div>
  </div>
  ${dialog()}
  ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}`;
}

function todayKey() {
  const days = weekDays(0);
  return days.find(d => d === iso(new Date())) || days[0];
}

/* ── Today ─────────────────────────────────────────────────────────────── */
function todayTab() {
  const viewedDay = dayKey(state.dayOffset);
  const isRealToday = state.dayOffset === 0;
  const total = state.people.length || 1;
  const answers = state.answers[viewedDay] || {};
  const ins = state.people.filter(p => answers[p.id] === true);
  const outs = state.people.filter(p => answers[p.id] === false);
  const unknown = state.people.filter(p => answers[p.id] === undefined);
  const mine = state.me ? answers[state.me] : undefined;
  const cutoff = (state.settings.cutoff || "09:00").slice(0, 5);
  const me = state.people.find(p => p.id === state.me);
  const isChef = !!me && !!me.is_chef;
  const isManager = isAnswerManager(state.me);

  const title = isChef
    ? (isRealToday ? "Wie viele essen heute mit?"
      : state.dayOffset === -1 ? "Wie viele haben gestern mitgegessen?"
      : state.dayOffset === 1 ? "Wie viele essen morgen mit?"
      : state.dayOffset < 0 ? "Wie viele haben mitgegessen?"
      : "Wie viele essen mit?")
    : (isRealToday ? "Isst du heute mit?"
      : state.dayOffset === -1 ? "Hast du gestern mitgegessen?"
      : state.dayOffset === 1 ? "Isst du morgen mit?"
      : state.dayOffset < 0 ? "Hast du mitgegessen?"
      : "Isst du mit?");

  const fullGroup = (label, list, color, emptyText) => {
    if (!list.length) {
      return emptyText ? `<div class="rostergroup">
        <div class="group-label" style="color:${color}">${label}</div>
        <p class="muted" style="margin-top:8px">${emptyText}</p>
      </div>` : "";
    }
    return `<div class="rostergroup">
      <div class="group-label" style="color:${color}">${label}<span class="group-count">${list.length} ${
        list.length === 1 ? "Person" : "Personen"}</span></div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-top:9px">
        ${list.map(p => {
          const [bg, ink] = tintFor(p.id);
          return `<div class="pill">
            <span class="avatar" style="width:30px;height:30px;font-size:10.5px;background:${bg};color:${ink}">${esc(initials(p.name))}</span>
            <span class="name">${esc(p.name)}</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  };

  // People who haven't answered are usually the biggest group early in the
  // day — a compact avatar stack instead of a full pill each avoids
  // repeating "zählt als Nein" over and over.
  const unknownGroup = !unknown.length ? "" : `<div class="rostergroup">
    <div class="group-label" style="color:var(--color-accent-700)">Noch keine Antwort<span class="group-count">${unknown.length} ${
      unknown.length === 1 ? "Person" : "Personen"}</span></div>
    <div class="avatarstack">
      ${unknown.slice(0, 8).map(p => {
        const [bg, ink] = tintFor(p.id);
        return `<span class="avatar" style="background:${bg};color:${ink}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`;
      }).join("")}
      ${unknown.length > 8 ? `<span class="avatar more">+${unknown.length - 8}</span>` : ""}
    </div>
    <div class="muted" style="margin-top:9px">Zählt automatisch als Nein um ${cutoff} Uhr</div>
  </div>`;

  const groups = fullGroup("Isst mit", ins, "var(--color-accent-800)", "Noch niemand bestätigt") +
    fullGroup("Isst nicht mit", outs, "var(--color-neutral-700)") + unknownGroup;

  return `<div class="cols">
    <div class="col-main">
      <div class="kicker">${esc(new Date(viewedDay + "T12:00:00").toLocaleDateString("de-DE",
        { weekday: "long", day: "numeric", month: "long" }))}</div>
      <div class="h1">${title}</div>
      <div class="daynav monthnav">
        <button class="btn btn-secondary" data-act="prevDay" style="padding:9px 16px" aria-label="Vorheriger Tag">&lsaquo;</button>
        ${isRealToday
          ? `<span class="label">Heute</span>`
          : `<button class="linkbtn" data-act="goToday">Zu heute</button>`}
        <button class="btn btn-secondary" data-act="nextDay" style="padding:9px 16px" aria-label="Nächster Tag">&rsaquo;</button>
      </div>

      <div class="dishcard" style="margin-top:22px">
        <div class="label">${isRealToday ? "Heutiges Gericht" : "Gericht"}</div>
        <div class="h2" style="margin-top:6px">${esc(state.meals[viewedDay] || "Noch kein Gericht festgelegt")}</div>
        <div style="display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap">
          <button class="linkbtn" data-act="openDish" data-arg="${viewedDay}"
            style="font-family:var(--font-heading);font-size:13px">${isRealToday ? "Heutiges Gericht ändern" : "Gericht ändern"}</button>
          ${isManager ? `<button class="linkbtn" data-act="openCost" data-arg="${viewedDay}"
            style="font-family:var(--font-heading);font-size:13px">${state.costs[viewedDay] != null
              ? "Kosten ändern (" + state.costs[viewedDay].toFixed(2).replace(".", ",") + " &euro;)"
              : "Kosten eintragen"}</button>` : ""}
        </div>
      </div>

      ${isChef ? "" : `
      <div class="answer-pair">
        <button class="bigbtn ${mine === true ? "on-yes" : ""}" data-act="answer" data-day="${viewedDay}" data-eat="yes">
          <strong>Ja</strong><small>ich bin dabei</small></button>
        <button class="bigbtn ${mine === false ? "on-no" : ""}" data-act="answer" data-day="${viewedDay}" data-eat="no">
          <strong>Nein</strong><small>${isRealToday ? "heute nicht" : "nicht dabei"}</small></button>
      </div>

      ${isRealToday ? `<div class="cutoff">${icon.clock}<span>${mine === undefined
        ? "Antworte vor " + cutoff + " Uhr &mdash; danach ist die Küche gesperrt"
        : "Änderbar bis " + cutoff + " Uhr"}</span></div>` : ""}
      `}

      <div class="headcount">
        <div style="display:flex;align-items:baseline;gap:12px">
          <span class="big">${ins.length} / ${state.people.length}</span>
          <span style="font-size:14px;color:var(--color-accent-800)">für die Küche bestätigt</span>
        </div>
        <div class="bar">
          <span style="width:${Math.round(ins.length / total * 100)}%;background:var(--color-accent)"></span>
          <span style="width:${Math.round(unknown.length / total * 100)}%;background:var(--color-accent-300)"></span>
        </div>
        <div style="margin-top:9px;font-size:12.5px;color:var(--color-accent-800)">${ins.length} Ja &middot;
          ${outs.length} Nein &middot; ${unknown.length} unbeantwortet, zählt um ${cutoff} Uhr als Nein</div>
      </div>
    </div>

    <div class="col-side">
      <div class="rostercard">
        <div class="rosterhead">
          <div class="h3">Am Tisch</div>
          <span class="muted">live</span>
        </div>
        <div style="margin-top:14px">${groups}</div>
      </div>
    </div>
  </div>`;
}

/* ── This week ─────────────────────────────────────────────────────────── */
const DOW_SHORT = ["Mo", "Di", "Mi", "Do", "Fr"];

function sinceLabel(day) {
  if (!day) return "noch nie gekocht";
  const days = Math.round((new Date(iso(new Date()) + "T12:00:00") - new Date(day + "T12:00:00")) / 86400000);
  if (days <= 0) return "zuletzt heute";
  if (days === 1) return "zuletzt gestern";
  if (days < 7) return `zuletzt vor ${days} Tagen`;
  const weeks = Math.round(days / 7);
  if (weeks < 9) return weeks === 1 ? "zuletzt vor 1 Woche" : `zuletzt vor ${weeks} Wochen`;
  const months = Math.round(days / 30);
  return months === 1 ? "zuletzt vor 1 Monat" : `zuletzt vor ${months} Monaten`;
}

const wishCount = n => n === 1 ? "1 Wunsch" : n + " Wünsche";

function miniAvatars(ids) {
  return `<span class="miniavatars">${ids.slice(0, 4).map(id => {
    const p = state.people.find(x => x.id === id);
    const [bg, ink] = tintFor(id);
    return `<span class="avatar" style="background:${bg};color:${ink}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`;
  }).join("")}</span>`;
}

// Wraps the part of `name` that matches `query` in <mark>, escaping both halves.
function highlight(name, query) {
  const q = (query || "").trim().toLowerCase();
  const at = q ? name.toLowerCase().indexOf(q) : -1;
  if (at < 0) return esc(name);
  return esc(name.slice(0, at)) + "<mark>" + esc(name.slice(at, at + q.length)) + "</mark>" + esc(name.slice(at + q.length));
}

// Everything the week view needs to know about dishes for the week on screen:
// which dish is already planned on which day, and which wished-for dish is
// suggested for each free day (most wishes first, never the same one twice).
function dishContext() {
  const days = weekDays(state.weekOffset);
  const todayIso = iso(new Date());
  const groups = dishGroups();
  const plannedOn = {};
  days.forEach((day, i) => {
    if (state.meals[day] && !plannedOn[dishKey(state.meals[day])]) plannedOn[dishKey(state.meals[day])] = DOW_SHORT[i];
  });
  const wished = groups.filter(g => g.voters.length)
    .sort((a, b) => b.voters.length - a.voters.length || (a.last || "").localeCompare(b.last || "") || a.name.localeCompare(b.name, "de"));
  const candidates = wished.filter(g => !plannedOn[g.key]);
  const suggestionFor = {};
  const suggestedOn = {};
  days.forEach((day, i) => {
    // Past days can't take a dish any more (the database locks them).
    if (state.meals[day] || day < todayIso || !candidates.length) return;
    const g = candidates.shift();
    suggestionFor[day] = g;
    suggestedOn[g.key] = DOW_SHORT[i];
  });
  return { days, groups, plannedOn, wished, suggestionFor, suggestedOn };
}

function wishButton(g) {
  const mine = !!state.me && g.voters.includes(state.me);
  return `<button class="wishbtn ${mine ? "on" : ""}" data-act="toggleWish" data-key="${esc(g.key)}">${
    mine ? "&#9733; Gewünscht" : "&#9734; Wünschen"}</button>`;
}

function allDishRowsHtml() {
  const { groups, plannedOn } = dishContext();
  const q = state.dishSearch.trim().toLowerCase();
  const editing = state.dishEdit && isAnswerManager(state.me);
  const rows = groups
    .filter(g => !q || g.key.includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, "de"))
    .map(g => `<div class="wishrow">
      <span class="name">${highlight(g.name, q)}<span class="sub">${sinceLabel(g.last)}</span></span>
      ${editing
        ? `<button class="iconbtn" data-act="openRenameDish" data-key="${esc(g.key)}" title="Umbenennen oder zusammenführen">&#9998;</button>
           <button class="iconbtn" data-act="hideDish" data-key="${esc(g.key)}" data-name="${esc(g.name)}" title="Aus der Liste entfernen">&#10005;</button>`
        : plannedOn[g.key] ? `<span class="planchip">Diese Woche: ${plannedOn[g.key]}</span>` : wishButton(g)}
    </div>`).join("");
  return rows || `<p class="muted">Kein Gericht gefunden.</p>`;
}

// Before anything is typed, the dish dialog offers the wished-for dishes as
// one-tap picks — so moving a wish to another day than the one it was
// suggested for doesn't need any typing. Dishes already planned in that
// day's week are left out.
function wishPicksHtml() {
  const mon = mondayOf(new Date(state.dialogDay + "T12:00:00"));
  const planned = new Set([0, 1, 2, 3, 4].map(i => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return state.meals[iso(d)];
  }).filter(Boolean).map(dishKey));
  const picks = dishGroups()
    .filter(g => g.voters.length && !planned.has(g.key))
    .sort((a, b) => b.voters.length - a.voters.length || a.name.localeCompare(b.name, "de"))
    .slice(0, 6);
  if (!picks.length) return "";
  return `<div class="muted" style="padding-left:4px;margin-top:6px">Gewünscht &mdash; zum Übernehmen antippen:</div>
    <div class="ac">${picks.map(g => `<button type="button" class="ac-item" data-act="pickDishSuggestion" data-name="${esc(g.name)}">
      <span>${esc(g.name)}</span><span class="m">&#9733; ${wishCount(g.voters.length)}</span>
    </button>`).join("")}</div>`;
}

// Name suggestions under the "Gericht festlegen" input, so a dish cooked
// before gets picked with its existing spelling instead of a new variant.
function dishSuggestHtml() {
  const q = state.dishQuery.trim().toLowerCase();
  if (q.length < 2) return wishPicksHtml();
  const matches = dishGroups()
    .filter(g => g.key.includes(q) && g.key !== q)
    .sort((a, b) => b.voters.length - a.voters.length
      || Number(b.key.startsWith(q)) - Number(a.key.startsWith(q))
      || a.name.localeCompare(b.name, "de"))
    .slice(0, 5);
  if (!matches.length) {
    if (findDishGroup(q)) return "";
    return `<div class="muted" style="padding-left:4px;margin-top:6px">Neues Gericht &mdash; kommt beim Speichern automatisch in die Liste.</div>`;
  }
  return `<div class="ac">${matches.map(g => `<button type="button" class="ac-item" data-act="pickDishSuggestion" data-name="${esc(g.name)}">
      <span>${highlight(g.name, q)}</span>
      <span class="m">${g.voters.length ? "&#9733; " + wishCount(g.voters.length) + " &middot; " : ""}${sinceLabel(g.last)}</span>
    </button>`).join("")}</div>`;
}

function weekTab() {
  const today = todayKey();
  const total = state.people.length || 1;
  const isManager = isAnswerManager(state.me);
  const { days, groups, plannedOn, wished, suggestionFor, suggestedOn } = dishContext();
  const title = state.weekOffset === 0 ? "Diese Woche"
    : state.weekOffset === -1 ? "Letzte Woche"
    : state.weekOffset === 1 ? "Nächste Woche"
    : state.weekOffset < 0 ? "Vor " + (-state.weekOffset) + " Wochen"
    : "In " + state.weekOffset + " Wochen";

  const linkStyle = "font-size:11.5px;text-underline-offset:2px";
  const cards = days.map((day, i) => {
    const answers = state.answers[day] || {};
    const count = state.people.filter(p => answers[p.id] === true).length;
    const mine = state.me ? answers[state.me] : undefined;
    const isToday = day === today;
    const sugg = suggestionFor[day];
    const middle = state.meals[day]
      ? `<div class="dish">${esc(state.meals[day])}</div>
         <button class="linkbtn" data-act="openDish" data-arg="${day}" style="${linkStyle}">Gericht ändern</button>`
      : sugg
        ? `<div class="dish open">Noch offen</div>
           <div class="suggest">
             <div class="lbl">&#9733; Meistgewünscht</div>
             <div class="nm">${esc(sugg.name)}</div>
             <div class="meta">${miniAvatars(sugg.voters)}${wishCount(sugg.voters.length)}</div>
             <button class="take" data-act="takeSuggestion" data-day="${day}" data-dish="${esc(sugg.name)}">Übernehmen</button>
           </div>
           <button class="linkbtn" data-act="openDish" data-arg="${day}" style="${linkStyle};margin-top:9px">Anderes Gericht</button>`
        : `<div class="dish">Noch kein Gericht festgelegt</div>
           <button class="linkbtn" data-act="openDish" data-arg="${day}" style="${linkStyle}">Gericht festlegen</button>`;
    return `<div class="daycard ${isToday ? "today" : ""}">
      <div class="dow">${DOW[i]}</div>
      <div class="dom">${Number(day.slice(8))}</div>
      ${middle}
      <div class="muted" style="margin-top:10px">${count} von ${state.people.length}${isToday ? " &middot; heute" : ""}</div>
      <div class="thinbar"><span style="width:${Math.round(count / total * 100)}%;background:${
        isToday ? "var(--color-accent)" : "var(--color-accent-2-400)"}"></span></div>
      <div class="smallpair">
        <button class="smallbtn ${mine === true ? "on-yes" : ""}" data-act="answer" data-day="${day}" data-eat="yes">Ja</button>
        <button class="smallbtn ${mine === false ? "on-no" : ""}" data-act="answer" data-day="${day}" data-eat="no">Nein</button>
      </div>
    </div>`;
  }).join("");

  const counts = days.map(day => state.people.filter(p => (state.answers[day] || {})[p.id] === true).length);
  const busiest = DOW[counts.indexOf(Math.max.apply(null, counts))];
  const mineCount = days.filter(d => (state.answers[d] || {})[state.me] === true).length;

  const wishRows = wished.map(g => `<div class="wishrow">
      <span class="name">${esc(g.name)}<span class="sub">${sinceLabel(g.last)}</span></span>
      ${plannedOn[g.key] ? `<span class="planchip">Diese Woche: ${plannedOn[g.key]}</span>`
        : suggestedOn[g.key] ? `<span class="suggchip">Vorschlag für ${suggestedOn[g.key]}</span>` : ""}
      <span class="votes">${miniAvatars(g.voters)}${g.voters.length}</span>
      ${wishButton(g)}
    </div>`).join("");

  const allDishes = !groups.length
    ? `<p class="muted" style="margin-top:12px">Noch keine Gerichte in der Historie.</p>`
    : !state.dishListOpen
      ? `<button class="allbtn" data-act="toggleDishList">Alle Gerichte anzeigen (${groups.length}) &#9662;</button>`
      : `<div class="cardhead" style="margin-top:24px">
          <div class="h3" style="font-size:16px">Alle Gerichte (${groups.length})</div>
          <button class="linkbtn" data-act="toggleDishList" style="font-size:12.5px">Zuklappen</button>
        </div>
        ${state.dishEdit ? `<p class="muted" style="margin-top:6px">&#9998; benennt ein Gericht um. Gibst du dabei genau den Namen
          eines anderen Gerichts ein, werden beide zusammengeführt.</p>` : ""}
        <input class="input" id="dishSearch" placeholder="Gericht suchen &hellip;" autocomplete="off"
          value="${esc(state.dishSearch)}" style="margin-top:10px">
        <div class="wishlist" id="dishAllRows" style="margin-top:10px">${allDishRowsHtml()}</div>`;

  return `<div>
    <div class="monthhead">
      <div>
        <div class="kicker">${days[0].split("-").reverse().join(".")} &ndash; ${days[4].split("-").reverse().join(".")}</div>
        <div class="h1">${title}</div>
      </div>
      <div class="monthnav">
        <button class="btn btn-secondary" data-act="prevWeek" style="padding:9px 16px" aria-label="Vorherige Woche">&lsaquo;</button>
        ${state.weekOffset !== 0
          ? `<button class="linkbtn" data-act="thisWeek">Zur aktuellen Woche</button>`
          : `<span class="label">Aktuell</span>`}
        <button class="btn btn-secondary" data-act="nextWeek" style="padding:9px 16px" aria-label="Nächste Woche">&rsaquo;</button>
      </div>
    </div>
    <p class="lead">Du bist an ${mineCount} von 5 Tagen dabei. Antworte im Voraus, damit der Koch nicht raten muss.</p>
    <div class="weekgrid">${cards}</div>
    <div class="stats" style="max-width:760px">
      <div class="stat sage">
        <div class="num" style="font-size:26px">${counts.reduce((a, b) => a + b, 0)}</div>
        <div class="cap">Essen in dieser Woche</div>
      </div>
      <div class="stat">
        <div class="num" style="font-size:26px">${busiest || "&mdash;"}</div>
        <div class="cap">meistbesuchter Tag</div>
      </div>
    </div>

    <div class="dishvotecard">
      <div class="cardhead">
        <div class="h2" style="font-size:18px">Wünsche</div>
        ${isManager && groups.length ? `<button class="linkbtn" data-act="toggleDishEdit" style="font-size:12.5px">${
          state.dishEdit ? "Fertig" : "Bearbeiten"}</button>` : ""}
      </div>
      <p class="muted" style="margin-top:4px">Was soll bald wieder auf den Tisch? Die meistgewünschten Gerichte
        erscheinen als Vorschlag an freien Tagen.</p>
      <div class="wishlist">${wishRows || `<p class="muted">Noch keine Wünsche &mdash; öffne &bdquo;Alle Gerichte&ldquo;
        und tippe bei einem Gericht auf &#9734; Wünschen.</p>`}</div>
      ${allDishes}
    </div>
  </div>`;
}

/* ── Monthly overview ──────────────────────────────────────────────────── */
function monthTab() {
  const isManager = isAnswerManager(state.me);

  // state.balances comes from the person_balances view, which has no sense
  // of "active" — it includes anyone who ever had a row in people, even
  // long-deactivated duplicates. Everywhere else in the app only active
  // people are shown, so filter here too before building rows/totals.
  const activeIds = new Set(state.people.map(p => p.id));
  const activeBalances = state.balances.filter(b => activeIds.has(b.id));

  const peopleRows = activeBalances.map(b => {
    const cls = b.balance > 0.005 ? "owes" : b.balance < -0.005 ? "credit" : "even";
    const label = b.balance > 0.005
      ? "schuldet " + b.balance.toFixed(2).replace(".", ",") + " &euro;"
      : b.balance < -0.005
        ? "im Guthaben: " + Math.abs(b.balance).toFixed(2).replace(".", ",") + " &euro;"
        : "ausgeglichen";
    return `<tr>
      <td>${esc(b.name)}${b.id === state.me ? " (du)" : ""}</td>
      <td style="font-weight:700">${b.mealsEaten || 0}</td>
      <td><span class="balance-amount ${cls}">${label}</span></td>
    </tr>`;
  }).join("");

  const myBalance = activeBalances.find(b => b.id === state.me);
  const balColor = !myBalance || myBalance.balance <= 0.005 ? "var(--color-accent-2-700)" : "var(--color-accent-700)";
  const balCap = !myBalance || Math.abs(myBalance.balance) < 0.005 ? "ausgeglichen"
    : myBalance.balance > 0 ? "du schuldest" : "du bist im Guthaben";
  const balNum = !myBalance ? "0 &euro;" : Math.abs(myBalance.balance).toFixed(2).replace(".", ",") + " &euro;";

  const totalMealsAll = activeBalances.reduce((t, b) => t + (b.mealsEaten || 0), 0);
  const avgPriceAll = totalMealsAll > 0 ? state.totalDishCostAll / totalMealsAll : 0;

  const myMeals = myBalance ? myBalance.mealsEaten : 0;
  const myAvgPrice = myMeals > 0 ? (myBalance.dishOwed || 0) / myMeals : 0;

  // Manager-only history of Allgemeinkosten/Einzahlungen, so a mistyped
  // amount can be fixed or removed later instead of staying wrong forever.
  const fmtEntryDate = iso => new Date(iso).toLocaleDateString("de-DE",
    { day: "2-digit", month: "2-digit", year: "2-digit" });

  const generalCostRows = state.generalCosts.map(g => `<div class="gerichtrow">
      <span class="name">${g.note ? esc(g.note) : "Allgemeinkosten"}</span>
      <span class="count">${fmtEntryDate(g.createdAt)}</span>
      <span class="balance-amount owes">${g.amount.toFixed(2).replace(".", ",")} &euro;</span>
      <button class="iconbtn" data-act="openEditGeneralCost" data-arg="${esc(g.id)}" title="Bearbeiten">&#9998;</button>
      <button class="iconbtn" data-act="deleteGeneralCost" data-arg="${esc(g.id)}" title="Löschen">&#10005;</button>
    </div>`).join("");

  // One line per change: what (and which day/person), who did it, when.
  const eur = n => Number(n).toFixed(2).replace(".", ",") + " €";
  const nameOf = id => { const p = state.people.find(x => x.id === id); return p ? p.name : "Entfernte Person"; };
  const logRows = state.moneyLog.map(l => {
    const what = l.kind === "payment" ? "Einzahlung von " + nameOf(l.ref_person)
      + (l.old_ref_person ? " (vorher " + nameOf(l.old_ref_person) + ")" : "")
      : l.kind === "general_cost" ? "Allgemeinkosten" + (l.note ? " „" + l.note + "“" : "")
      : "Tageskosten " + shortDay(l.ref_day);
    const amount = l.action === "create" ? eur(l.new_amount)
      : l.action === "update" ? eur(l.old_amount) + " → " + eur(l.new_amount)
      : eur(l.old_amount);
    const when = new Date(l.created_at).toLocaleString("de-DE",
      { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
    const note = l.kind === "payment" && l.note ? " · " + l.note : "";
    return `<div class="gerichtrow">
      <span class="name">${esc(what)}<span class="sub">${esc(when)} · von ${esc(nameOf(l.actor_id))}${esc(note)}</span></span>
      <span class="logchip ${l.action}">${{ create: "neu", update: "geändert", delete: "gelöscht" }[l.action]}</span>
      <span class="balance-amount even" style="color:var(--color-text)">${esc(amount)}</span>
    </div>`;
  }).join("");

  const paymentRows = state.payments.map(p => {
    const person = state.people.find(x => x.id === p.personId);
    const name = person ? person.name : "Entfernte Person";
    return `<div class="gerichtrow">
      <span class="name">${esc(name)}${p.note ? " &middot; " + esc(p.note) : ""}</span>
      <span class="count">${fmtEntryDate(p.createdAt)}</span>
      <span class="balance-amount credit">${p.amount.toFixed(2).replace(".", ",")} &euro;</span>
      <button class="iconbtn" data-act="openEditPayment" data-arg="${esc(p.id)}" title="Bearbeiten">&#9998;</button>
      <button class="iconbtn" data-act="deletePayment" data-arg="${esc(p.id)}" title="Löschen">&#10005;</button>
    </div>`;
  }).join("");

  return `<div>
    <div class="monthhead">
      <div>
        <div class="kicker">Alles im Überblick</div>
        <div class="h1">Übersicht</div>
      </div>
    </div>

    <div class="kicker" style="margin-top:18px">Deine Zahlen</div>
    <div class="stats" style="margin-top:10px">
      <div class="stat accent">
        <div class="num">${myMeals}</div>
        <div class="cap">Essen insgesamt (du)</div>
      </div>
      <div class="stat">
        <div class="num">${state.last30Count}</div>
        <div class="cap">Essen, letzte 30 Tage</div>
      </div>
      <div class="stat" style="background:var(--color-surface)">
        <div class="num">${myAvgPrice > 0 ? myAvgPrice.toFixed(2).replace(".", ",") + " &euro;" : "&ndash;"}</div>
        <div class="cap">&Oslash; Preis pro Mahlzeit</div>
      </div>
      <div class="stat" style="background:var(--color-surface)">
        <div class="num" style="color:${balColor}">${balNum}</div>
        <div class="cap">${balCap}</div>
      </div>
    </div>

    <div class="kicker" style="margin-top:20px">Küche insgesamt</div>
    <div class="stats" style="margin-top:10px">
      <div class="stat sage">
        <div class="num">${state.totalCookDays}</div>
        <div class="cap">Kochtage insgesamt</div>
      </div>
      <div class="stat sage">
        <div class="num">${totalMealsAll}</div>
        <div class="cap">Essen insgesamt (alle)</div>
      </div>
      <div class="stat">
        <div class="num">${avgPriceAll > 0 ? avgPriceAll.toFixed(2).replace(".", ",") + " &euro;" : "&ndash;"}</div>
        <div class="cap">&Oslash; Preis pro Mahlzeit (alle)</div>
      </div>
    </div>

    <div class="monthhead" style="margin-top:28px;align-items:center">
      <div class="h2" style="font-size:18px">Personen</div>
      ${isManager ? `<div style="display:flex;gap:8px 16px;flex-wrap:wrap;align-items:baseline">
        <button class="linkbtn" data-act="openGeneralCost" style="font-family:var(--font-heading);font-size:13px">+ Allgemeinkosten eintragen</button>
        <button class="linkbtn" data-act="openPayment" style="font-family:var(--font-heading);font-size:13px">+ Einzahlung eintragen</button>
        <button class="linkbtn" data-act="openPinChange" style="font-size:13px">PIN ändern</button>
      </div>` : ""}
    </div>
    <div class="tablewrap" style="margin-top:14px">
      <table>
        <thead><tr><th>Person</th><th>Essen</th><th>Kasse</th></tr></thead>
        <tbody>${peopleRows || `<tr><td colspan="3" class="muted">Noch keine Daten.</td></tr>`}</tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:10px">Essen zählt alle bestätigten Ja-Antworten seit Beginn. Die Kasse läuft
      ebenfalls durchgehend weiter &mdash; erst eine Einzahlung senkt den Betrag.</p>

    ${isManager ? `<div class="h2" style="font-size:18px;margin-top:28px">Verlauf</div>
    <div class="dishvotecard" style="margin-top:14px">
      <div class="kicker">Allgemeinkosten</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${generalCostRows || `<p class="muted">Noch keine Allgemeinkosten eingetragen.</p>`}
      </div>
      <div class="kicker" style="margin-top:20px">Einzahlungen</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${paymentRows || `<p class="muted">Noch keine Einzahlungen eingetragen.</p>`}
      </div>
      <div class="kicker" style="margin-top:20px">Änderungsprotokoll</div>
      <p class="muted" style="margin-top:4px">Jede Änderung an Kosten und Einzahlungen, mit wessen PIN sie gemacht wurde.
        Einträge hier kann niemand bearbeiten oder löschen.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${logRows || `<p class="muted">Noch keine Änderungen &mdash; ab jetzt wird hier alles festgehalten.</p>`}
      </div>
    </div>` : ""}
  </div>`;
}

/* ── Verwalten (Doro/Isabella only) ───────────────────────────────────────
   Set or clear anyone's answer for any day, past or future, with no cutoff
   restriction — separate from the normal per-person Ja/Nein flow. ────── */
function manageTab() {
  const day = state.manageDay || iso(new Date());
  const isRealToday = day === iso(new Date());
  const answers = state.answers[day] || {};
  const meal = state.meals[day];
  const dayLabel = esc(new Date(day + "T12:00:00").toLocaleDateString("de-DE",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" }));

  const rows = state.people.map(p => {
    const val = answers[p.id];
    const [bg, ink] = tintFor(p.id);
    return `<div class="pill" style="padding:6px 10px 6px 6px">
      <span class="avatar" style="background:${bg};color:${ink}">${esc(initials(p.name))}</span>
      <span class="name">${esc(p.name)}</span>
      <div class="smallpair" style="margin-top:0;width:150px;flex:none">
        <button class="smallbtn ${val === true ? "on-yes" : ""}" data-act="manageAnswer" data-day="${day}" data-person="${esc(p.id)}" data-eat="yes">Ja</button>
        <button class="smallbtn ${val === false ? "on-no" : ""}" data-act="manageAnswer" data-day="${day}" data-person="${esc(p.id)}" data-eat="no">Nein</button>
      </div>
    </div>`;
  }).join("");

  return `<div>
    <div class="kicker">Nur für Verwalter/-innen</div>
    <div class="h1">Antworten verwalten</div>
    <p class="lead">Setze oder entferne die Antwort für jede Person, an jedem Tag &mdash; auch rückwirkend
      und ohne Cutoff-Grenze.</p>

    <div class="daynav monthnav" style="margin-top:22px">
      <button class="btn btn-secondary" data-act="prevManageDay" style="padding:9px 16px" aria-label="Vorheriger Tag">&lsaquo;</button>
      ${isRealToday
        ? `<span class="label">Heute</span>`
        : `<button class="linkbtn" data-act="goManageToday">Zu heute</button>`}
      <button class="btn btn-secondary" data-act="nextManageDay" style="padding:9px 16px" aria-label="Nächster Tag">&rsaquo;</button>
    </div>

    <p class="muted" style="margin-top:10px">${dayLabel}${meal ? " &mdash; " + esc(meal) : " &mdash; noch kein Gericht festgelegt"}</p>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;max-width:560px">
      ${rows || `<p class="muted">Noch keine Personen auf der Liste.</p>`}
    </div>
  </div>`;
}

/* ── Dialogs ───────────────────────────────────────────────────────────── */
// Every dialog that changes money asks for the manager's own PIN — the
// database checks it, so it can't be skipped with the shared team login.
function pinField() {
  return `<div class="field" style="margin-top:12px"><label for="managerPin">Deine Verwalter-PIN</label>
    <input class="input" id="managerPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"
      placeholder="PIN eingeben"></div>`;
}

function dialog() {
  if (!state.dialog) return "";

  let title, subtitle, inner;

  if (state.dialog === "dish") {
    title = "Gericht festlegen";
    subtitle = "Jede/-r kann bearbeiten &mdash; letzte Änderung gewinnt";
    inner = `<div class="field"><label for="dish">Gericht</label>
        <input class="input" id="dish" autocomplete="off" value="${esc(state.meals[state.dialogDay] || "")}">
        <div id="dishSuggest">${dishSuggestHtml()}</div></div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="saveDish">Gericht speichern</button>
      </div>`;
  } else if (state.dialog === "away") {
    title = "Abwesend oder im Urlaub";
    subtitle = "Trägt für jeden Werktag im Zeitraum Nein ein";
    const todayIso = iso(new Date());
    const mine = state.absences
      .filter(a => a.person_id === state.me && a.to_day >= todayIso)
      .sort((a, b) => a.from_day.localeCompare(b.from_day));
    const existing = !mine.length ? "" : `<div class="field"><label>Schon eingetragen</label>
        <div style="display:flex;flex-direction:column;gap:6px">${mine.map(a => `<div class="gerichtrow"
            style="background:var(--color-surface);padding:9px 10px 9px 16px">
          <span class="name">${esc(shortDay(a.from_day))} &ndash; ${esc(shortDay(a.to_day))}</span>
          <button class="btn btn-secondary" data-act="deleteAbsence" data-arg="${esc(a.id)}"
            style="padding:7px 14px;font-size:13px;background:var(--color-bg)">Löschen</button>
        </div>`).join("")}</div></div>`;
    inner = `${existing}<div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:130px"><label for="awayFrom">Von</label>
          <input class="input" id="awayFrom" type="date"></div>
        <div class="field" style="flex:1;min-width:130px"><label for="awayTo">Bis</label>
          <input class="input" id="awayTo" type="date"></div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="saveAway">Abwesenheit speichern</button>
      </div>`;
  } else if (state.dialog === "cost") {
    const dayLabel = esc(new Date(state.dialogDay + "T12:00:00").toLocaleDateString("de-DE",
      { weekday: "long", day: "numeric", month: "long" }));
    const current = state.costs[state.dialogDay];
    title = "Kosten eintragen";
    subtitle = dayLabel;
    inner = `<div class="field"><label for="costAmount">Betrag in &euro; (leer lassen zum Entfernen)</label>
        <input class="input" id="costAmount" inputmode="decimal" placeholder="z. B. 32,50"
          value="${current != null ? esc(String(current).replace(".", ",")) : ""}"></div>
      ${pinField()}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="saveCost">Kosten speichern</button>
      </div>`;
  } else if (state.dialog === "payment") {
    const editing = state.dialogId ? state.payments.find(p => p.id === state.dialogId) : null;
    title = editing ? "Einzahlung bearbeiten" : "Einzahlung eintragen";
    subtitle = "Senkt den Kontostand der ausgewählten Person";
    const options = state.people.map(p => `<option value="${esc(p.id)}"
        ${editing && editing.personId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    inner = `<div class="field"><label for="paymentPerson">Person</label>
        <select class="input" id="paymentPerson">${options}</select></div>
      <div class="field" style="margin-top:12px"><label for="paymentAmount">Betrag in &euro;</label>
        <input class="input" id="paymentAmount" inputmode="decimal" placeholder="z. B. 20"
          value="${editing ? esc(String(editing.amount).replace(".", ",")) : ""}"></div>
      <div class="field" style="margin-top:12px"><label for="paymentNote">Notiz (optional)</label>
        <input class="input" id="paymentNote" placeholder="z. B. für Oktober"
          value="${editing && editing.note ? esc(editing.note) : ""}"></div>
      ${pinField()}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="savePayment">${editing ? "Speichern" : "Einzahlung speichern"}</button>
      </div>`;
  } else if (state.dialog === "generalcost") {
    const editing = state.dialogId ? state.generalCosts.find(g => g.id === state.dialogId) : null;
    title = editing ? "Allgemeinkosten bearbeiten" : "Allgemeinkosten eintragen";
    subtitle = "Wird gleichmäßig auf alle aktuell aktiven Personen aufgeteilt";
    inner = `<div class="field"><label for="generalCostAmount">Betrag in &euro;</label>
        <input class="input" id="generalCostAmount" inputmode="decimal" placeholder="z. B. 50"
          value="${editing ? esc(String(editing.amount).replace(".", ",")) : ""}"></div>
      <div class="field" style="margin-top:12px"><label for="generalCostNote">Wofür? (optional)</label>
        <input class="input" id="generalCostNote" placeholder="z. B. Küchenreinigung, Gewürze"
          value="${editing && editing.note ? esc(editing.note) : ""}"></div>
      ${pinField()}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="saveGeneralCost">${editing ? "Speichern" : "Allgemeinkosten speichern"}</button>
      </div>`;
  } else if (state.dialog === "renamedish") {
    const group = dishGroups().find(g => g.key === state.dialogDay);
    title = "Gericht umbenennen";
    subtitle = "Heißt ein anderes Gericht schon so, werden beide zusammengeführt";
    inner = `<div class="field"><label for="renameDish">Neuer Name</label>
        <input class="input" id="renameDish" value="${esc(group ? group.name : "")}"></div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="saveRenameDish">Umbenennen</button>
      </div>`;
  } else if (state.dialog === "pinchange") {
    title = "PIN ändern";
    subtitle = "Deine persönliche Verwalter-PIN, 4 bis 8 Ziffern";
    const pinInput = (id, label, top) => `<div class="field"${top ? ' style="margin-top:12px"' : ""}><label for="${id}">${label}</label>
        <input class="input" id="${id}" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>`;
    inner = `${pinInput("oldPin", "Bisherige PIN")}
      ${pinInput("newPin", "Neue PIN", true)}
      ${pinInput("newPin2", "Neue PIN wiederholen", true)}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="savePinChange">PIN speichern</button>
      </div>`;
  } else {
    title = "Wirklich entfernen?";
    subtitle = "Das lässt sich hier nicht rückgängig machen";
    const moneyDelete = state.confirmAct === "deleteGeneralCost" || state.confirmAct === "deletePayment";
    inner = `<p style="font-size:15px">${esc(state.confirmMessage)}</p>
      ${moneyDelete ? pinField() : ""}
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
        <button class="btn btn-primary" data-act="runConfirmedDelete">Entfernen</button>
      </div>`;
  }

  return `<div class="dialog-backdrop"><div class="dialog">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
      <div>
        <div class="dialog-title">${title}</div>
        <div style="font-size:13px;color:var(--color-neutral-700);margin-top:2px">${subtitle}</div>
      </div>
      <button class="iconbtn" data-act="closeDialog" style="width:32px;height:32px;font-size:14px">&#10005;</button>
    </div>
    ${state.dialogError ? `<div class="banner" role="alert">${esc(state.dialogError)}</div>` : ""}
    ${inner}
  </div></div>`;
}

start();
</script>
</body>
</html>
