<script>
/* ===========================================================================
   SETTINGS
   ---------------------------------------------------------------------------
   These two point the app at your database (Supabase → Settings → API).
   Safe to publish: this key can read and write nothing until someone signs
   in with the office password.
   =========================================================================== */
const SUPABASE_URL = "https://wmysyplhcbnnunuiskum.supabase.co";
const SUPABASE_KEY = "sb_publishable_pnJAsLuKUcXFgSmHLvDeDA_7Xt4w93H";

// The single account everyone shares. Not a real mailbox — auth just needs
// some identifier, so nobody ever types or owns an email address.
const OFFICE_ID = "office@cantina.local";

const DOW = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
const ME_KEY = "cantina.me";   // remembers which name this browser picked
const CHEF_NAME = "doro";     // this person gets a headcount-first view instead of the eating prompt

// Avatar colour pairs — [background, text]
const TINTS = [
  ["var(--color-accent-200)", "var(--color-accent-800)"],
  ["var(--color-accent-2-200)", "var(--color-accent-2-800)"],
  ["var(--color-neutral-300)", "var(--color-neutral-800)"],
];


/* ===========================================================================
   STATE  —  everything the screen is drawn from
   =========================================================================== */
const state = {
  phase: "boot",          // boot | login | pick | app
  tab: "today",           // today | week | month
  menuOpen: false,        // mobile hamburger menu
  me: localStorage.getItem(ME_KEY) || null,
  busy: false,
  live: false,
  error: null,
  toast: null,
  people: [],
  meals: {},              // { "2026-09-05": "Lasagne" }
  answers: {},            // { "2026-09-05": { personId: true } }
  absences: [],
  settings: { cutoff: "09:30", tz: "" },
  weekOffset: 0,
  monthOffset: 0,
  monthRows: [],
  monthDays: 0,
  dialog: null,           // null | "dish" | "away"
  dialogDay: null,
};

let client = null;
let channel = null;
let toastTimer = null;


/* ===========================================================================
   SMALL HELPERS
   =========================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const iso = d => d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");

function mondayOf(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  d.setHours(12, 0, 0, 0);
  return d;
}

function weekDays(offset = 0) {
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + offset * 7);
  return [0, 1, 2, 3, 4].map(i => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return iso(d);
  });
}

function monthRange() {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + state.monthOffset, 1, 12);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);
  return {
    first: iso(first),
    last: iso(last),
    label: first.toLocaleDateString("de-DE", { month: "long", year: "numeric" }),
    short: first.toLocaleDateString("de-DE", { month: "long" }),
  };
}

function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/);
  const a = parts[0][0] || "?";
  const b = parts[1] ? parts[1][0] : (parts[0][1] || "");
  return (a + b).toUpperCase();
}

function tintFor(id) {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 997;
  return TINTS[h % 3];
}

function flash(msg) {
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
}

function fail(e) {
  state.error = (e && e.message) || String(e);
  render();
}

const icon = {
  bowl: (size, stroke) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="${stroke}" stroke-width="2.75" stroke-linecap="round">
    <path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M12 4v3"></path></svg>`,
  calendar: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"></rect>
    <path d="M8 3v4M16 3v4M3 11h18"></path></svg>`,
  chart: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"></path></svg>`,
  clock: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle>
    <path d="M12 8v4l2.5 2"></path></svg>`,
  palm: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-700)"
    stroke-width="2.75" stroke-linecap="round" style="flex:none;margin-top:2px">
    <path d="M4 20h16"></path><path d="M12 20V9"></path><path d="M12 9c4-3 8-2 8-2s-1 5-8 2z"></path></svg>`,
};


/* ===========================================================================
   TALKING TO THE DATABASE
   =========================================================================== */
async function start() {
  if (!window.supabase) {
    state.error = "Datenbank-Bibliothek konnte nicht geladen werden — bitte Verbindung prüfen.";
    state.phase = "login";
    render();
    return;
  }
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await client.auth.getSession();
  if (data && data.session) await afterLogin();
  else { state.phase = "login"; render(); }
}

async function login(password) {
  state.busy = true;
  state.error = null;
  render();
  const { error } = await client.auth.signInWithPassword({ email: OFFICE_ID, password });
  state.busy = false;
  if (error) { state.error = "Das Passwort war falsch."; render(); return; }
  await afterLogin();
}

async function afterLogin() {
  state.phase = state.me ? "app" : "pick";
  state.error = null;
  render();
  await refresh();
  subscribe();
}

// Live updates: when anyone answers, changes a dish, or edits the roster,
// every open browser reloads its data within about a second.
function subscribe() {
  if (channel) return;
  channel = client.channel("cantina")
    .on("postgres_changes", { event: "*", schema: "public", table: "answers" }, refresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "meals" }, refresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "people" }, refresh)
    .subscribe(status => { state.live = status === "SUBSCRIBED"; render(); });
}

async function refresh() {
  if (!client) return;
  // Always include the real current week (the Today tab needs it) plus
  // whichever week "This week" is currently browsing, if different.
  const currentDays = weekDays(0);
  const days = state.weekOffset === 0
    ? currentDays
    : Array.from(new Set([...currentDays, ...weekDays(state.weekOffset)]));
  const mr = monthRange();
  try {
    const [people, meals, answers, absences, settings, monthAnswers, monthMeals] = await Promise.all([
      client.from("people").select("id,name,active").eq("active", true).order("name"),
      client.from("meals").select("day,dish").in("day", days),
      client.from("answers").select("day,person_id,eating").in("day", days),
      client.from("absences").select("id,person_id,from_day,to_day"),
      client.from("settings").select("cutoff,tz").eq("id", 1).maybeSingle(),
      client.from("answers").select("person_id,eating,day")
        .gte("day", mr.first).lte("day", mr.last).eq("eating", true),
      client.from("meals").select("day").gte("day", mr.first).lte("day", mr.last),
    ]);

    const broke = [people, meals, answers, absences, monthAnswers, monthMeals].find(r => r.error);
    if (broke) throw broke.error;

    state.people = people.data || [];
    state.absences = absences.data || [];
    if (settings && settings.data) state.settings = settings.data;

    state.meals = {};
    (meals.data || []).forEach(m => { state.meals[m.day] = m.dish; });

    state.answers = {};
    (answers.data || []).forEach(a => {
      if (!state.answers[a.day]) state.answers[a.day] = {};
      state.answers[a.day][a.person_id] = a.eating;
    });

    const counts = {};
    (monthAnswers.data || []).forEach(a => { counts[a.person_id] = (counts[a.person_id] || 0) + 1; });
    state.monthRows = state.people
      .map(p => ({ id: p.id, name: p.name, count: counts[p.id] || 0 }))
      .sort((a, b) => b.count - a.count);
    state.monthDays = (monthMeals.data || []).length;

    render();
  } catch (e) { fail(e); }
}

// Tapping the answer you already gave clears it (back to "no answer yet").
async function answer(day, eating) {
  if (!state.me) return;
  const current = (state.answers[day] || {})[state.me];
  const next = current === eating ? null : eating;
  try {
    if (next === null) {
      const { error } = await client.from("answers")
        .delete().eq("day", day).eq("person_id", state.me);
      if (error) throw error;
    } else {
      const { error } = await client.from("answers")
        .upsert({ day, person_id: state.me, eating: next }, { onConflict: "day,person_id" });
      if (error) throw error;
    }
    await refresh();
    if (next !== null) flash(next ? "Du bist dabei" : "Als nicht essend markiert");
  } catch (e) { fail(e); }
}

async function saveDish(day, dish) {
  state.dialog = null;
  if (!dish) { render(); return; }
  try {
    const { error } = await client.from("meals").upsert({ day, dish }, { onConflict: "day" });
    if (error) throw error;
    await refresh();
    flash("Gericht für alle aktualisiert");
  } catch (e) { fail(e); }
}

// Marks every weekday in the range as "not eating". Past days stay locked.
async function saveAway(from, to) {
  state.dialog = null;
  if (!from || !to || !state.me) { render(); return; }
  const rows = [];
  const today = iso(new Date());
  const d = new Date(from + "T12:00:00");
  const end = new Date(to + "T12:00:00");
  while (d <= end) {
    const day = iso(d);
    if (d.getDay() >= 1 && d.getDay() <= 5 && day >= today) {
      rows.push({ day, person_id: state.me, eating: false });
    }
    d.setDate(d.getDate() + 1);
  }
  try {
    const { error: e1 } = await client.from("absences")
      .insert({ person_id: state.me, from_day: from, to_day: to });
    if (e1) throw e1;
    if (rows.length) {
      const { error: e2 } = await client.from("answers")
        .upsert(rows, { onConflict: "day,person_id" });
      if (e2) throw e2;
    }
    await refresh();
    flash("Abwesend — für " + rows.length + " Tage mit Nein beantwortet");
  } catch (e) { fail(e); }
}

async function addPerson(name) {
  if (!name) return;
  const { error } = await client.from("people").insert({ name });
  if (error) { fail(error); return; }
  await refresh();
}

// People are never deleted — just marked inactive, so old months keep their numbers.
async function removePerson(id) {
  const { error } = await client.from("people").update({ active: false }).eq("id", id);
  if (error) { fail(error); return; }
  await refresh();
}


/* ===========================================================================
   WHAT EVERY BUTTON DOES
   ---------------------------------------------------------------------------
   Buttons carry data-act="name"; this is the list of what each name does.
   =========================================================================== */
const actions = {
  tab: el => { state.tab = el.dataset.arg; state.menuOpen = false; render(); },
  toggleMenu: () => { state.menuOpen = !state.menuOpen; render(); },

  answer: el => answer(el.dataset.day, el.dataset.eat === "yes"),

  pickMe: el => {
    state.me = el.dataset.arg;
    localStorage.setItem(ME_KEY, state.me);
    state.phase = "app";
    render();
  },
  forgetMe: () => {
    localStorage.removeItem(ME_KEY);
    state.me = null;
    state.phase = "pick";
    state.menuOpen = false;
    render();
  },
  signOut: async () => {
    await client.auth.signOut();
    state.phase = "login";
    state.menuOpen = false;
    render();
  },

  addPerson: () => {
    const box = document.getElementById("newName");
    const name = box.value.trim();
    box.value = "";
    if (!name) return;
    // Typing a name that's already on the list logs you in as that person
    // instead of creating a duplicate colleague (e.g. same person on a
    // second device).
    const existing = state.people.find(p => p.name.trim().toLowerCase() === name.toLowerCase());
    if (existing) {
      actions.pickMe({ dataset: { arg: existing.id } });
      flash("Willkommen zurück, " + existing.name);
      return;
    }
    addPerson(name);
  },
  removePerson: el => removePerson(el.dataset.arg),

  openDish: el => { state.dialog = "dish"; state.dialogDay = el.dataset.arg; render(); },
  saveDish: () => saveDish(state.dialogDay, document.getElementById("dish").value.trim()),

  openAway: () => { state.dialog = "away"; state.menuOpen = false; render(); },
  saveAway: () => saveAway(
    document.getElementById("awayFrom").value,
    document.getElementById("awayTo").value
  ),

  closeDialog: () => { state.dialog = null; render(); },
  dismissError: () => { state.error = null; render(); },

  prevMonth: () => { state.monthOffset -= 1; refresh(); },
  nextMonth: () => { state.monthOffset = Math.min(0, state.monthOffset + 1); refresh(); },

  prevWeek: () => { state.weekOffset -= 1; refresh(); },
  nextWeek: () => { state.weekOffset += 1; refresh(); },
  thisWeek: () => { state.weekOffset = 0; refresh(); },
};

document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});

document.getElementById("app").addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "loginForm") login(document.getElementById("pw").value);
  if (e.target.id === "addForm") actions.addPerson();
});


/* ===========================================================================
   DRAWING THE SCREEN
   ---------------------------------------------------------------------------
   render() rebuilds the whole page from `state`. Anything typed into a text
   box is carried across, so live updates never eat what you're writing.
   =========================================================================== */
let lastDialogKey = "";

function render() {
  const app = document.getElementById("app");

  // Which dialog (and which day) was on screen last time. If that changed we
  // must NOT carry text across — otherwise Thursday's half-typed dish would
  // reappear when you open Monday.
  const dialogKey = String(state.dialog) + "|" + String(state.dialogDay);
  const sameDialog = dialogKey === lastDialogKey;
  lastDialogKey = dialogKey;

  const typed = {};
  app.querySelectorAll("input[id]").forEach(i => { typed[i.id] = i.value; });
  const focused = document.activeElement ? document.activeElement.id : null;

  app.innerHTML = screen();

  if (sameDialog) {
    app.querySelectorAll("input[id]").forEach(i => {
      if (typed[i.id] !== undefined) i.value = typed[i.id];
    });
  }
  if (focused) {
    const again = document.getElementById(focused);
    if (again) again.focus();
  }
}

function screen() {
  if (state.phase === "boot") return "";
  if (state.phase === "login") return loginScreen();
  if (state.phase === "pick") return pickScreen();
  return appScreen();
}

function errorBanner() {
  if (!state.error) return "";
  return `<div class="banner" style="margin-bottom:18px">

}

function todayKey() {
  const days = weekDays(0);
  return days.find(d => d === iso(new Date())) || days[0];
}

/* ── This week ─────────────────────────────────────────────────────────── */

  const days = weekDays(state.weekOffset);
  const today = todayKey();
  const total = state.people.length || 1;
  const title = state.weekOffset === 0 ? "Diese Woche"

    : "In " + state.weekOffset + " Wochen";

  const cards = days.map((day, i) => {
    const answers = state.answers[day] || {};
    const count = state.people.filter(p => answers[p.id] === true).length;
    const mine = state.me ? answers[state.me] : undefined;
    const isToday = day === today;
    return `<div class="daycard ${isToday ? "today" : ""}">
      <div class="dow">${DOW[i]}</div>
      <div class="dom">${Number(day.slice(8))}</div>
      <div class="dish">${esc(state.meals[day] || "Noch kein Gericht festgelegt")}</div>

        style="font-size:11.5px;text-underline-offset:2px">Gericht festlegen</button>
      <div class="muted" style="margin-top:10px">${count} von ${state.people.length}${isToday ? " &middot; heute" : ""}</div>
      <div class="thinbar"><span style="width:${Math.round(count / total * 100)}%;background:${
        isToday ? "var(--color-accent)" : "var(--color-accent-2-400)"}"></span></div>
      <div class="smallpair">
        <button class="smallbtn ${mine === true ? "on-yes" : ""}" data-act="answer" data-day="${day}" data-eat="yes">Ja</button>
        <button class="smallbtn ${mine === false ? "on-no" : ""}" data-act="answer" data-day="${day}" data-eat="no">Nein</button>
      </div>
    </div>`;
  }).join("");

  const counts = days.map(day => state.people.filter(p => (state.answers[day] || {})[p.id] === true).length);
  const busiest = DOW[counts.indexOf(Math.max.apply(null, counts))];
  const mineCount = days.filter(d => (state.answers[d] || {})[state.me] === true).length;

  return `<div style="animation:riseIn .3s ease both">
    <div class="monthhead">
      <div>
        <div class="kicker">${days[0].split("-").reverse().join(".")} &ndash; ${days[4].split("-").reverse().join(".")}</div>
        <div class="h1">${title}</div>
      </div>
      <div class="monthnav">
        <button class="btn btn-secondary" data-act="prevWeek" style="padding:9px 16px" aria-label="Vorherige Woche">&lsaquo;</button>
        ${state.weekOffset !== 0
          ? `<button class="linkbtn" data-act="thisWeek" style="font-size:12.5px">Zur aktuellen Woche</button>`
          : `<span class="label">Aktuell</span>`}
        <button class="btn btn-secondary" data-act="nextWeek" style="padding:9px 16px" aria-label="Nächste Woche">&rsaquo;</button>
      </div>
    </div>
    <p class="lead">Du bist an ${mineCount} von 5 Tagen dabei. Antworte im Voraus, damit der Koch nicht raten muss.</p>
    <div class="weekgrid">${cards}</div>
    <div class="stats" style="max-width:760px">
      <div class="stat sage">
        <div class="num" style="font-size:26px">${counts.reduce((a, b) => a + b, 0)}</div>
        <div class="cap">Essen in dieser Woche</div>
      </div>
      <div class="stat">
        <div class="num" style="font-size:26px">${busiest || "&mdash;"}</div>
        <div class="cap">meistbesuchter Tag</div>
      </div>
    </div>
  </div>`;
}

/* ── Monthly overview ──────────────────────────────────────────────────── */
function monthTab() {
  const mr = monthRange();
  const most = Math.max(1, state.monthDays || 1);
  const rows = state.monthRows.map(r => `<tr>
    <td>${esc(r.name)}${r.id === state.me ? " (du)" : ""}</td>
    <td style="font-weight:700">${r.count}</td>
    <td><span class="thinbar" style="margin:0;height:8px"><span style="width:${
      Math.round(r.count / most * 100)}%;background:${
      r.id === state.me ? "var(--color-accent)" : "var(--color-accent-2-500)"}"></span></span></td>
  </tr>`).join("");

  return `<div style="animation:riseIn .3s ease both">
    <div class="monthhead">
      <div>
        <div class="kicker">Küchenstatistik</div>
        <div class="h1">Monatsübersicht</div>
      </div>
      <div class="monthnav">
        <button class="btn btn-secondary" data-act="prevMonth" style="padding:9px 16px">&lsaquo;</button>
        <span class="label">${esc(mr.label)}</span>
        <button class="btn btn-secondary" data-act="nextMonth" style="padding:9px 16px">&rsaquo;</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat accent">
        <div class="num">${state.monthRows.reduce((t, r) => t + r.count, 0)}</div>
        <div class="cap">Essen im ${esc(mr.short)}</div>
      </div>
      <div class="stat sage">
        <div class="num">${state.monthDays}</div>
        <div class="cap">Tage, an denen gekocht wurde</div>
      </div>
      <div class="stat">
        <div class="num">${(state.monthRows.find(r => r.id === state.me) || { count: 0 }).count}</div>
        <div class="cap">deine Essen</div>
      </div>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Person</th><th>Essen</th><th style="width:46%">Anteil an Kochtagen</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:10px">Gezählt werden bestätigte Ja-Antworten. Vergangene Tage sind gesperrt,
      diese Zahlen können also im Nachhinein nicht mehr geändert werden.</p>
  </div>`;
}

/* ── Dialogs ───────────────────────────────────────────────────────────── */
function dialog() {
  if (!state.dialog) return "";

  const inner = state.dialog === "dish"
    ? `<div class="field"><label for="dish">Gericht</label>
         <input class="input" id="dish" value="${esc(state.meals[state.dialogDay] || "")}"></div>
       <p style="font-size:13px;color:var(--color-neutral-700)">Jede/-r kann das Gericht korrigieren &mdash;
         die letzte Änderung gewinnt und alle sehen sie innerhalb einer Sekunde.</p>
       <div class="dialog-actions">
         <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
         <button class="btn btn-primary" data-act="saveDish">Gericht speichern</button>
       </div>`
    : `<div style="display:flex;gap:12px">
         <div class="field" style="flex:1"><label for="awayFrom">Von</label>
           <input class="input" id="awayFrom" type="date"></div>
         <div class="field" style="flex:1"><label for="awayTo">Bis</label>
           <input class="input" id="awayTo" type="date"></div>
       </div>
       <p style="font-size:13px;color:var(--color-neutral-700)">Für jeden Werktag im Zeitraum wird
         "Nein" für dich eingetragen. Vergangene Tage bleiben gesperrt.</p>
       <div class="dialog-actions">
         <button class="btn btn-secondary" data-act="closeDialog">Abbrechen</button>
         <button class="btn btn-primary" data-act="saveAway">Abwesenheit speichern</button>
       </div>`;

  return `<div class="dialog-backdrop"><div class="dialog">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
      <div>
        <div class="dialog-title">${state.dialog === "away" ? "Abwesend oder im Urlaub" : "Gericht festlegen"}</div>
        <div style="font-size:13px;color:var(--color-neutral-700);margin-top:2px">${
          state.dialog === "away" ? "Trägt für jeden Werktag im Zeitraum Nein ein" : "Jede/-r kann bearbeiten &mdash; letzte Änderung gewinnt"}</div>
      </div>
      <button class="iconbtn" data-act="closeDialog" style="width:32px;height:32px;font-size:14px">&#10005;</button>
    </div>
    ${inner}
  </div></div>`;
}

start();
</script>
</body>
</html>
